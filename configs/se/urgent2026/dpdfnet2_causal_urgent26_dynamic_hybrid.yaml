# ============================================================
# 实验配置：DPDFNet-2，URGENT2026 动态仿真，显式 CompositeLoss（近因果，16 kHz）
# ============================================================
# 模型：DPDFNet-2（当前活动参数为 dprnn_num_blocks=2、Concat、全频 ERB mask）
# 实时边界：df_lookahead=2、conv_lookahead=2 固定保留 2 帧前瞻；cache 支持逐帧处理但不能消除前瞻。
# 16 kHz、hop_length=160 时，每帧 10 ms，固定算法前瞻约 20 ms。
# Params：local 2.4980M total；paper/reference 2.49M
# 1 秒输入 MACs：local 1.3530G @ 16 kHz（THOP，partial/unverified；通常不计 STFT/iSTFT）；paper/reference 1.35G
# 独立 FLOPs：not measured（本地审计与论文表均仅给 MACs，未运行独立 FLOPs profiler）
# Trainer MOS boundary：Trainer 只计算侵入式客观指标；DNSMOS/NISQA/UTMOS/SCOREQ 等须经 evaluate 离线计算
# 论文/参考：DPDFNet-2 表项 2.49M Params/1.35G MACs；DF2/DF3/DPDFNet-4/8 仅为可选变体参考
# 本地口径：当前 YAML 经 tools/model_tools/audit_metrics.py 按 1 秒输入复核；当前 Composite 组件未启用论文 LSNR/over-attenuation 组合目标
# 目的：在线 A–F 仿真与 offline 预混配置对照时，应固定 seed、步数与数据清单；报告需注明 simulation_cfg。
# 训练目标：GTCRN 压缩频谱 + log-ratio；模型内 lsnr_min/lsnr_max 仅用于网络侧 LSNR 嵌入，不直接进入本 loss。
#
# | 参考变体          | enc_concat | enc_lin_groups | lin_groups | erb_apply_above_bins | dprnn_num_blocks | gru_variant | 采样 | Params/MACs reference |
# |-------------------|------------|----------------|------------|----------------------|------------------|-------------|------|-----------------------|
# | DeepFilterNet2    | true       | 8              | 8          | null                 | 0                | squeezed    | 16k  | 论文约 2.31M/0.36G    |
# | DeepFilterNet3    | false      | 32             | 16         | 96                   | 0                | squeezed_s  | 48k  | 约 2.14M/0.35G；STFT 960/480 |
# | DPDFNet-2/4/8     | true       | 32             | 16         | null                 | 2/4/8            | squeezed_s  | 16k  | 2.49/2.84/3.54M；1.35/2.36/4.37G |
#
# 数据管线：data.mode=dynamic 在线 A–F 仿真；每条样本实时加载 clean 语音与独立 noise/RIR source，
#   依次执行 Layer A 语音增广 → Layer B 三路互斥场景 → Layer C 声学混合（RIR/音量/加性噪声/风噪/彩色噪声）
#   → Layer D normalize→guard → Layer E URGENT 信道退化 → Layer F post-mix distortion，Dataset 只交付
#   observation/target；SE dynamic batch 走标准 collate。DFN3 若用 48 kHz 需单独数据/STFT。
#   validation 走 offline 预混对（data.validation 的 clean_scp/noisy_scp），与 train 的在线仿真分布不同。
# 复杂度测量口径：B=1、1 s、16 kHz、幅度 [-1,1] waveform（F=161、T=100 帧）；仅计模型前向，图外 STFT/iSTFT 不计。
# RTF：not measured（未在本机测量实时因子；流式逐帧 cache 路径见实现文件）。
# 实现路径：tasks/se/models/discriminative/deepfilternet.py（接口层）→ tasks/se/models/modules/deepfilternet_impl.py
# 训练：python train.py -C configs/se/urgent2026/dpdfnet2_causal_urgent26_dynamic_hybrid.yaml
# ============================================================

# ----------------------------------------------------------------------
# 全局：随机种子、混合精度
# ----------------------------------------------------------------------
meta:
  seed: 42   # 全局随机种子；固定后 Layer A–F 抽样与 DataLoader worker 序列可复现
  # false = FP32；改 true 时须同时设置 amp_dtype（推荐 bfloat16，FP16 在 STFT 上易溢出）
  use_amp: false
  use_ema: false   # 是否维护 EMA 权重；false = 只用原始权重
  # false = 保留 cudnn.benchmark 默认 true（按 shape 自动选最快 kernel，速度优先）；
  # true = 强制 cudnn.benchmark=false 并启用确定性算法，牺牲吞吐换跨运行可复现
  deterministic: false

# ---- STFT：DeepFilterNet 16 kHz 配置；build_model 将 n_fft/hop_length/win_length/window 注入 model.args ----
stft:
  n_fft: 320        # FFT 点数；16 kHz 下 20 ms 窗，F = n_fft/2+1 = 161
  hop_length: 160   # 帧移，单位 sample；16 kHz 下 10 ms/帧
  win_length: 320   # 窗长，单位 sample（与 n_fft 相同）
  window: hann      # 分析窗类型；DeepFilterNet 按 hann 设计

# ----------------------------------------------------------------------
# 模型：DeepFilterNet；本配置以 dprnn_num_blocks=2 选择 DPDFNet-2 变体。
# 完整构造参数见 deepfilternet_impl.DeepFilterNet.__init__；活动参数与 offline 配置对齐。
# ----------------------------------------------------------------------
model:
  type: DeepFilterNet     # 注册名；未知 type 由 registry 拒绝；未知 args kwargs 由模型构造抛 TypeError
  args:                   # 构造参数；与 deepfilternet_impl.DeepFilterNet.__init__ 形参一一对应
    samplerate: 16000          # 固定 16 kHz，与 STFT 设计一致
    enc_concat: true           # true = 拼接 ERB 与线性编码路径；DF2/DPDFNet 使用该模式
    enc_lin_groups: 32         # 编码线性层分组数
    lin_groups: 16             # 解码线性层分组数
    erb_apply_above_bins: ~    # ~ = 全频应用 ERB mask；DeepFilterNet3 常用 96
    dprnn_num_blocks: 2        # 0 = DeepFilterNet2/3；2/4/8 = DPDFNet-2/4/8
    # gru_variant: "squeezed_s"  # 枚举：squeezed | squeezed_s；DFN3/DPDFNet 默认 squeezed_s，DFN2 使用 squeezed
    freq_df: 4800              # DF 路径截止频率，单位 Hz
    nb_erb: 32                 # ERB 频带数
    min_nb_freqs: 1            # 每个 ERB band 的最少频点数
    erb_to_db: true            # 是否将 ERB 特征转换为 dB
    conv_ch: 64                # 编码卷积通道数
    enc_gru_dim: 256           # 编码 GRU 维度
    erb_dec_gru_dim: 256       # ERB 解码 GRU 维度
    df_dec_gru_dim: 256        # DF 解码 GRU 维度
    df_lookahead: 2            # 固定 2 帧 DF 前瞻；cache 不能消除
    conv_lookahead: 2          # 固定 2 帧卷积前瞻；cache 不能消除
    emb_num_layers: 2          # embedding 层数
    df_num_layers: 2           # DF 层数
    mask_method: "before_df"   # 枚举：before_df | after_df
    upsample_conv_type: "subpixel"  # 枚举：subpixel | transpose
    # ----- 其余参数与 deepfilternet_impl.DeepFilterNet.__init__ 默认值一致 -----
    alpha_norm: 0.98           # ERB 归一化系数
    conv_kernel_inp: [3, 3]    # 输入卷积核 [time, frequency]
    conv_kernel: [1, 3]        # 编码卷积核 [time, frequency]
    convt_kernel: [1, 3]       # 解码转置卷积核 [time, frequency]
    emb_gru_skip_enc: "none"   # embedding GRU skip 枚举；none = 不启用
    df_order: 5                # Deep Filter 阶数
    df_pathway_kernel_size_t: 5  # DF 路径时间维卷积核大小
    df_gru_skip: "groupedlinear"  # DF GRU skip 类型
    stateful: false            # 是否启用 stateful 流式状态
    erb_dynamic_var: false     # 是否启用 ERB 动态方差
    norm_stateful: false       # 归一化是否保留流式状态
    group_linear_type: "loop" # 枚举：loop | einsum
    point_wise_type: "cnn"     # 枚举：cnn | linear
    group_gru: 1               # GRU 分组数
    separable_first_conv: true # 首层是否使用可分离卷积
    lsnr_min: -15.0            # LSNR 下限，单位 dB
    lsnr_max: 35.0             # LSNR 上限，单位 dB

# ----------------------------------------------------------------------
# 数据：动态在线混合；每条样本实时加载 clean speech 与独立 noise/RIR source 并执行增强。
# ----------------------------------------------------------------------
data:
  mode: dynamic      # 数据路由字段：dynamic = 框架内在线 A–F 仿真；缺失或非法值由 Dataset builder fail-fast
  sample_rate: 16000 # Hz；clean/noise/RIR 加载后统一重采样到该采样率
  # train split：split 级资源键（*_scp / filter_* / max_duration_* / repeat_*）只能写在这里，不能放进 simulation_cfg。
  # SCP 为四列 uid/fs/length/path，由 tools/prepare_data_tools/scp/prepare_scp.py 生成。
  train:
    speech_scp: "data/shared/urgent26_track1_se_dataset/urgent26_track1_universal_se/urgent26_clean_train.scp"  # clean 语音四列 SCP
    noise_scp: "data/shared/noise/filter/v2/train_noise_sources.scp"    # Layer C-1 加性噪声 source SCP（ordinary noise 池）
    # music_scp: data/ss/background/music/train.scp  # 可选背景音乐池；是否混入由 simulation_cfg.acoustic.background.music_ratio（默认 0.0，逐 source read 独立 rng 抽样）决定，与 Layer C-3 彩色噪声无关；本机当前未提供该 SCP，故保持注释
    windnoise_scp: "data/shared/noise/filter/v2/train_wind_noise_sources.scp"  # Layer C-2 side-chain 风噪 source SCP
    rir_scp: "data/shared/rirs/gpurir_static/gpurir/fs16000/train_rirs.scp"    # Layer C-0 RIR SCP（16 kHz gpurir_static）
    # filter_min_duration / filter_max_duration 在 source manifest 阶段按时长过滤，不进入 simulation_cfg
    filter_min_duration: 2.0   # 最短 clean speech 时长，单位 s；低于该值丢弃
    filter_max_duration: 30.0  # 最长 clean speech 时长，单位 s；高于该值丢弃
    # ------------------------------------------------------------------
    # A-3 模式 A 对齐：split 级 Dataset 参数，不能放进 simulation_cfg
    # ------------------------------------------------------------------
    max_duration_seconds: 10     # 固定 canvas 时长，单位 s；每条样本对齐到该长度
    repeat_to_max_duration: true # true = 短句 tile 到 max_duration_seconds（模式 A）；false = 不齐长
    repeat_tile_silence_gap: true # true = tile 段间插静音，减轻拼接边界阶跃
    repeat_tile_silence_gap_range: [0.02, 0.8]  # tile 间 gap 范围，单位 s；仅上键 true 时生效
    # ------------------------------------------------------------------
    # simulation_cfg：Layer A–F 在线仿真，顺序与 tasks/se/data/dynamic_dataset.py::_run 一致
    # ------------------------------------------------------------------
    simulation_cfg:
      # ------------------------------------------------------------------
      # [Layer A：clean speech 预处理] 仅作用于 clean source；silence.prob 决定模式 A/B
      # A-3 duration alignment 由 split 级 max_duration_seconds / repeat_* 控制，不能写进 simulation_cfg
      # 本层所有 prob_* 为独立伯努利门（逐样本 rng.random() 抽样，可共现），不是互斥组；
      # 未声明而取 runtime 默认 0.0 的 A-2 字段：prob_speed_perturb / prob_pitch_shift / prob_eq_perturb / prob_add_extra_space。
      # ------------------------------------------------------------------
      speech:
        # A-1 splice：仅模式 A 拼接短 utterance，句间插入随机 gap
        splice:
          enabled: true                    # 是否启用拼接；false 时单条样本只取一句
          seconds: 10.0                    # 固定 splice 目标时长，单位 s
          seconds_range: [5.0, 10.0]       # 随机目标时长范围，单位 s；设置后覆盖 speech.splice.seconds
          gap_range: [0.02, 1.0]           # utterance 间 gap 范围，单位 s
          max_repeat_times: 4              # 同一 utterance 最多重复次数
          equal_volume: true               # true = 段间做等响度对齐
          equal_volume_range: [-6, 6]      # 等响度相对增益范围，单位 dB
        random_start: false                # true = 从 utterance 内随机位置起截取
        # A-2 变速、变调、EQ 与额外静音。
        speed:
          prob: 0.0                        # [0,1]；变速命中概率（0 = 关闭，逐样本抽样）
          rate_range: [0.9, 1.1]           # 速度倍率范围，无量纲
        pitch:                             # A-2 变调
          prob: 0.0                        # [0,1]；变调命中概率（0 = 关闭）
          semitone_range: [-1.5, 1.5]      # 半音范围，单位 semitone
        eq:                                # A-2 频响均衡扰动
          prob: 0.0                        # [0,1]；EQ 扰动命中概率（0 = 关闭）
          db_range: [-5, 5]                # EQ 增益范围，单位 dB
        extra_space_prob: 0.0              # [0,1]；额外静音（空间感）注入概率（0 = 关闭）
        # 模式 B：单句固定静音画布（画布长度 = max_duration_seconds）
        silence:
          prob: 0.5                        # [0,1]；静音画布模式命中概率；与 splice 共同决定模式 A/B
          mode: "bimodal"                  # 枚举：uniform | bimodal；固定画布下不改变最终总静音量
          short_ratio: 0.30                # bimodal 下短静音段占比，无量纲 [0,1]
          short_range: [0.2, 0.8]          # 兼容抽样范围，单位 s
          long_range: [1.0, 5.0]           # 兼容抽样范围，单位 s
          position: "scene_aware"          # 枚举：random | front | back | center | turn_boundary | scene_aware
          beta_a: 0.6                      # Beta 分布参数 a
          beta_b: 0.4                      # Beta 分布参数 b
        # A-4 高通滤波。
        high_pass:
          enabled: true                    # 是否启用高通；false = 保留原始低频

      # Layer B：三路互斥场景。三项 prob_* 为一个互斥组，和必须为 1（abs 容差 1e-8），另要求
      #   prob_target_only + prob_noise_only <= 1.0；由 tasks/se/data/dynamic_dataset.py 在构造期 fail-fast。
      #   抽样方式：逐样本用 multinomial CDF 在 [0,1) 取一段，命中哪一场景即整条样本走该路径；
      #   nominal = 配置概率，realized = 实际命中率（随样本数波动）。Layer A 的 gap/留白在该层之前已生效。
      #   未声明而取 runtime 默认 0.0 的同层概率字段：scene.prob_timeline（跨源时间线窗口，配合 overlap_ratio_range）。
      scene:
        prob_target_only: 0 # [0,1]；observation=target=clean_target，跳过 C-1/C-2/C-3 加噪；本配置关闭
        prob_noise_only: 0  # [0,1]；observation=additive、target=0；additive 来自 noise_scp 或彩色噪声；本配置关闭
        prob_target_noise: 1.0 # [0,1]；完整混合 observation=target+additive；本配置唯一启用路径，保证三项和=1

      # ------------------------------------------------------------------
      # [Layer C：声学混合] C-0 RIR + C-0b target volume + C-1 加性噪声 + C-2 风噪 + C-3 彩色噪声
      # 本层 prob_* 为独立伯努利门（逐样本 rng 抽样，可共现），非互斥组
      # ------------------------------------------------------------------
      acoustic:
        # C-0b post-RIR target volume：以 early target 的 RMS 标定，full/early/target 共用同一 gain
        target:                            # C-0b 目标音量随机化
          volume:                          # 音量参数；enabled=false 时整块跳过
            enabled: true                  # true = 启用 C-0b 目标音量随机化；false = 保持原始电平
            db_range: [-40, 0]             # target level 范围，单位 dBFS
            use_rms: true                  # true = 以 RMS 标定而非峰值
            distribution: uniform          # 枚举：uniform | beta；beta_a/beta_b 仅对 beta 生效
            beta_a: 2.0                    # Beta 分布参数 a（仅 distribution=beta 时消费）
            beta_b: 2.0                    # Beta 分布参数 b（仅 distribution=beta 时消费）

        # C-0 RIR：backend 与房间几何（gpurir_*）用默认值，不在本文件重复。
        #   未声明而取 runtime 默认 0.0 的阵列概率字段：prob_array_rotation / prob_microphone_position_jitter
        #   （均要求 spatial_enabled=true，本非空间配置不可用）。
        rir:
          reverberation_prob: 0.5          # [0,1]；独立伯努利门，逐样本抽样；0 = 全干信号
          moving_prob: 0.0  # 在线 moving RIR 概率；0=全静态（本模板配方保持关闭，非框架限制）
          # acoustic.rir.segment_sec 仅用于离线 mono moving PKL 分段卷积；在线 moving 的分段由 trajectory timebase hop 决定
          target_type: early          # clean_target 保留 early-RIR；枚举：early | dry | rts；改 dry 时显式去混响
          reuse: false               # true = 同 worker 复用上一条 RIR；false = 每条样本重新抽取
          normalize: true            # full/early RIR 共用 full peak 归一化
          early_window_sec: 0.05           # early RIR 窗长，单位 s

        # C-1 加性噪声：noise_mix_prob 控制是否再混入第二段 noise_scp source。
        #   未声明而取 runtime 默认 0.0 的背景 family 概率：music_ratio（背景音乐）、
        #   prob_point_source_background / prob_wind_noise_background（要求 spatial_enabled=true 且 rir_backend=online）。
        background:
          noise_mix_prob: 0.0              # [0,1]；第二段加性噪声（C-1b）命中概率；0 = 关闭
          noise_mix_ratio_range: [0.1, 1.0] # 第二段噪声相对第一段的幅度比范围，无量纲
          snr_low: -5                      # 加性噪声 SNR 下限，单位 dB
          snr_high: 20                     # 加性噪声 SNR 上限，单位 dB
          reuse_noise: false               # true = 同 worker 复用上一条 noise waveform，并按当前样本重新对齐

          # C-2 风噪仅通过 sidechain wind_noise() 施加。
          prob_wind_noise_sidechain: 0.05  # [0,1]；sidechain 风噪命中概率，逐样本抽样，非加性叠加
          wind_noise_config:               # 风噪 compressor 参数；每项为 [min,max] 抽样区间
            threshold: [0.1, 0.3]          # compressor 阈值，归一化幅度 [0,1]
            ratio: [1, 20]                 # 压缩比，无量纲
            attack: [5, 100]               # 起振时间，单位 ms
            release: [5, 100]              # 释放时间，单位 ms
            sc_gain: [0.8, 1.2]            # sidechain 增益倍率，无量纲
            clipping_threshold: [0.85, 1.0] # 风噪波形截幅阈值，归一化幅度
            clipping_chance: 0.75          # [0,1]；每段风噪执行截幅的概率
            wind_noise_snr_range: [-10, 15] # sidechain 风噪 SNR 范围，单位 dB

          # C-3 彩色噪声：以 clean_target 功率标定 SNR，并计入 additive role。
          prob_colored_noise: 0.0          # [0,1]；彩色噪声命中概率；0 = 关闭
          colored_noise_snr_range: [10, 50] # 彩色噪声 SNR 范围，单位 dB
          colored_noise_types: [white, pink, brown, equalized] # 枚举：white | pink | brown | equalized

      # ------------------------------------------------------------------
      # [Layer E：URGENT2026 信道退化] 仅修改 observation；channel.enabled 是整层总开关
      # （Layer D post-mix normalize → guard 始终执行，本文件不设 post_mix）
      # num_augmentations 的概率和必须为 1（runtime 校验）；augmentations.*.weight 为相对权重，非概率
      # ------------------------------------------------------------------
      channel:
        enabled: true                            # false = 整层 E 跳过；true = 按 num_augmentations 等抽样
        augmentations_name: [bandwidth_limitation, clipping, codec, packet_loss] # 可用子项枚举；必须与 augmentations 的键集合一致
        num_augmentations: {0: 0.25, 1: 0.40, 2: 0.20, 3: 0.15} # 抽取子项数量的概率分布；键为数量、值为概率，和必须=1
        augmentations:                           # 每个子项一个条目；条目内 weight 为该子项被抽中的相对权重
          # 带宽限制：resample_methods 枚举 random = 从下采样/上采样族随机选
          bandwidth_limitation: {weight: 1.0, resample_methods: random}
          # 截幅：裁剪分位区间，单位 quantile（0 = 峰值，1 = 最小幅度）
          clipping: {weight: 1.0, clipping_min_quantile: [0.0, 0.1], clipping_max_quantile: [0.9, 1.0]}
          codec:                                 # 编解码退化；config 列出各格式及其质量档位
            weight: 1.0                          # 子项相对权重
            config:                              # 每项一种格式：qscale 为编码质量档位，越大质量越高
            - {format: mp3, encoder: ~, qscale: [1, 10]}   # mp3 无外部 encoder（~）
            - {format: ogg, encoder: [vorbis, opus], qscale: [1, 10]}  # ogg 可选 vorbis/opus 编码器
          # 丢包：包时长单位 ms、最大连续丢包数、丢包率范围 [0,1]
          packet_loss: {weight: 1.0, packet_duration_ms: 20, max_continuous_packet_loss: 10, packet_loss_rate: [0.05, 0.25]}
      device:                                       # Layer F：post-mix distortion（F-1~F-14）
        # ------------------------------------------------------------------
        # [Layer F：post-mix distortion] F-1~F-14，仅修改 observation；colored noise 已归入 C-3
        # 仿真收尾依次为 task-post-EF（SE no-op）→ final-guard → post-finite，Dataset 只交付 observation/target
        # 本层所有 prob_* 为独立伯努利门（逐样本 rng 抽样，可共现）；device.enabled=false 时整层跳过
        # ------------------------------------------------------------------
        enabled: false                              # Layer F 总开关；false = F-1~F-14 全部不执行
        # F-1 裁剪/失真；clip_variants 枚举：hard | soft | sigmoid | sox | pedal。
        prob_clip: 0.0                              # [0,1]；裁剪/失真命中概率；0 = 关闭
        clip_variants: [hard, soft, sigmoid, sox, pedal]  # 可用裁剪变体枚举
        clip_variant_probs: {hard: 0.4, soft: 0.2, sigmoid: 0.2, sox: 0.1, pedal: 0.1}  # 变体选择概率；键集合须与 clip_variants 一致、和必须=1
        clip_hard_portion: 0.5                      # hard 变体中波形被截幅的比例，[0,1]
        clip_hard_on_rate: true                     # hard 变体是否按采样率对齐截幅点
        clip_rate_range: [0.01, 0.2]                # 截幅比例抽样范围，[0,1]
        clip_threshold_db_range: [-20, -1]          # 截幅阈值范围，单位 dBFS
        clip_soft_slope_range: [1.0, 5.0]           # soft 变体斜率范围，无量纲
        clip_sigmoid_slope_range: [1.0, 5.0]        # sigmoid 变体斜率范围，无量纲
        clip_sox_threshold_db_range: [-15, -5]      # sox 变体阈值范围，单位 dBFS
        clip_pedal_threshold_db_range: [-15, -5]    # pedal 变体阈值范围，单位 dBFS

        # F-2 后处理 EQ。
        prob_post_eq: 0.0                           # [0,1]；后处理 EQ 命中概率；0 = 关闭
        post_eq_db_range: [-5, 5]                   # EQ 增益范围，单位 dB

        # F-3 低通滤波。
        prob_lowpass: 0.0                           # [0,1]；低通命中概率；0 = 关闭
        lowpass_cutoff_range: [1000, 8000]          # 截止频率范围，单位 Hz
        lowpass_order_range: [4, 20]                # 滤波器阶数范围，无量纲

        # F-4 带阻/陷波。
        prob_band_reject: 0.0                       # [0,1]；带阻命中概率；0 = 关闭
        band_reject_center_freq_range: [100, 8000]  # 中心频率范围，单位 Hz
        band_reject_freq_bw_range: [20, 500]        # 带宽范围，单位 Hz
        band_reject_use_stft: true                  # true = 在 STFT 域实现陷波
        band_reject_max_n: 2                        # 单条样本最多陷波个数

        # F-5 DC 偏移。
        prob_dc_offset: 0.0                         # [0,1]；DC 偏移命中概率；0 = 关闭
        dc_offset_range: [0.001, 0.2]               # DC 偏移量范围，归一化幅度

        # F-6 DRC 动态范围压缩（pedalboard，CPU）。
        prob_drc: 0.0                               # [0,1]；DRC 命中概率；0 = 关闭
        drc_threshold_db_range: [-50, 0]            # 压缩阈值范围，单位 dBFS
        drc_ratio_range: [1, 20]                    # 压缩比范围，无量纲
        drc_attack_ms_range: [0.5, 5.0]             # 起振时间范围，单位 ms
        drc_release_ms_range: [50, 1000]            # 释放时间范围，单位 ms

        # F-7 编解码；codecs_types 枚举：mp3 | gsm | opus | aac。
        prob_codecs: 0.0                            # [0,1]；编解码退化命中概率；0 = 关闭
        codecs_types: [mp3, gsm, opus, aac]         # 可用编码格式枚举

        # F-8 低比特 ADC 模拟。
        prob_bit_crush: 0.0                         # [0,1]；位深压缩命中概率；0 = 关闭
        bit_crush_range: [4, 16]                    # 目标位深范围，单位 bit

        # F-9 频谱时频洞（频率选择性衰落）。
        prob_spectral_holes: 0.0                    # [0,1]；时频洞命中概率；0 = 关闭
        spectral_holes_frame_length: 1024           # 分析窗长，单位 sample
        spectral_holes_hop_length: 256              # 帧移，单位 sample
        spectral_holes_num_range: [1, 20]           # 单条样本洞数范围，无量纲
        spectral_holes_width_freq_range: [1, 5]     # 洞宽范围，单位 frequency bin
        spectral_holes_width_time_range: [1, 5]     # 洞长范围，单位 frame
        spectral_holes_cutoff_freq: 10000           # 施加频率上限，单位 Hz

        # F-10/F-11 WebRTC NS/AGC 模拟。
        prob_webrtc_ns: 0.0                         # [0,1]；WebRTC 降噪命中概率；0 = 关闭
        webrtc_ns_levels: [0, 1, 2, 3]              # NS 档位枚举（0 = 最弱）
        prob_webrtc_agc: 0.0                        # [0,1]；WebRTC AGC 命中概率；0 = 关闭
        webrtc_agc_target_dbfs_range: [-31, -3]     # AGC 目标电平范围，单位 dBFS

        # F-12 低音增强。
        prob_bass_boost: 0.0                        # [0,1]；低音增强命中概率；0 = 关闭
        bass_boost_highpass_cutoff_range: [500, 2000] # 高通截止频率范围，单位 Hz
        bass_boost_attenuation_min_db: -25          # 低音最大衰减，单位 dB

        # F-13 频谱泄漏（STFT 窗效应）。
        prob_spectral_leakage: 0.0                  # [0,1]；频谱泄漏命中概率；0 = 关闭
        spectral_leakage_window_lengths: [1024, 2048, 4096] # 泄漏窗长候选，单位 sample
        spectral_leakage_max_time_shift: 20         # 最大时移，单位 sample

        # F-14 响度扰动。
        prob_loudness_perturb: 0.0                  # [0,1]；响度扰动命中概率；0 = 关闭
        loudness_factor_range: [0.1, 10.0]          # 响度倍率范围，无量纲
        loudness_max_n_intervals: 5                 # 单条样本最多分段扰动数

  # validation 使用 OfflineDataset；沿用 data.sample_rate=16000，并在加载时自动重采样。
  # data.validation.max_duration_seconds 只裁长样本；repeat_to_max_duration=false 时短样本由 collate 按 batch 补零。
  # validation split：使用 OfflineDataset；沿用 data.sample_rate=16000 并在加载时重采样
  validation:
    # 四列 SCP 内嵌 clean/noisy 各自的 uid/fs/length/path metadata。
    clean_scp: "data/shared/urgent26_track1_se_dataset/urgent26_track1_universal_se/urgent26_clean_val.scp"  # 验证 clean 语音四列 SCP
    noisy_scp: "data/shared/urgent26_track1_se_dataset/urgent26_track1_universal_se/urgent26_noisy_val.scp"  # 验证 noisy 四列 SCP（与 clean 逐条配对）
    max_duration_seconds: 10        # 单条样本最长 10 s
    repeat_to_max_duration: false   # false = 不齐长；true = tile 至 max_duration_seconds
    repeat_tile_silence_gap: false  # 仅 repeat_to_max_duration=true 时生效
    repeat_tile_silence_gap_range: [0.02, 0.2]  # tile 间 gap 范围，单位 s
    # target_sr: 16000  # 可选 validation override；未设置时沿用 data.sample_rate=16000（本配置未启用）
    filter_min_duration: 2.0   # 最短 clean 时长，单位 s
    filter_max_duration: 30.0  # 最长 clean 时长，单位 s

  # dataloader：dynamic train / offline validation 共用；batch 内短样本由 collate 补零
  dataloader:
    batch_size: 32            # 单卡 batch 大小
    num_workers: 4            # 每 rank 的数据加载进程数
    prefetch_factor: 4        # 建议 4~8，配合 num_workers 预取
    pin_memory: true          # 固定内存加速 H2D 拷贝
# --------------------------------------------------------------------------
# loss：显式 CompositeLoss（GTCRN 压缩频谱 + log-ratio）；STFT 几何由顶层 stft 注入
# DPDFNet 论文 Composite 配方见 docs/guides/loss/Loss_Configuration_Guide.md §8，勿与本配置混用
# --------------------------------------------------------------------------
loss:
  type: CompositeLoss          # 复合损失；顶层只接受 type/components/strict/enable_ss_undesired_energy
  components:                  # 组件列表；每项只接受 type/weight/args/name/enable_ss_undesired_energy
  - type: GTCRNCompressedSpectralLoss   # 压缩谱损失（实/虚部 + 幅度）
    weight: 1.0                # 组件总权重（无量纲）
    args:                      # 组件参数；未知键在 loss 构造前报错
      compress_factor: 0.3     # 幅度压缩指数 c=0.3
      lamda_ri: 30.0           # 实部/虚部损失权重
      lamda_mag: 70.0          # 幅度损失权重
  - type: GTCRNLogRatioLoss    # 压缩谱 log-ratio 损失（幅度域）
    weight: 1.0                # 组件总权重（无量纲）

# ----------------------------------------------------------------------
# optimizer
# ----------------------------------------------------------------------
optimizer:
  type: Adam                   # 优化器类型；未知类型在构造期 fail-fast
  args:                        # 优化器参数；未知键在构造期报错
    lr: 0.001                  # 学习率（无量纲）
# ----------------------------------------------------------------------
# scheduler：线性 warmup + 余弦退火；step 数均为 optimizer step。
# ----------------------------------------------------------------------
scheduler:
  type: LinearWarmupCosineAnnealing   # 线性 warmup + 余弦退火；按 optimizer step 计步
  args:                        # 调度器参数；未知键在构造期报错
    warmup_steps: 5000         # 线性 warmup 步数，单位 optimizer step
    decay_until_step: 100000   # 余弦退火终止步；应等于总优化步数
    max_lr: 1.0e-3             # warmup 后峰值学习率
    min_lr: 1.0e-6             # 退火终点学习率
# ----------------------------------------------------------------------
# trainer：验证/存盘语义见 core/trainer/base_trainer.py。
# ----------------------------------------------------------------------
trainer:
  # 类型与实验目标
  type: SETrainer              # 训练器类型；由 entry 路由到 tasks/se/trainer/se_trainer.py
  exp_path: exp/se/dpdfnet2_causal_urgent26_dynamic_hybrid  # 日志/checkpoint 输出目录（相对仓库根）

  # 训练规模与日志
  epochs: 60                   # 训练总 epoch 数
  gradient_clip_value: 5.0     # 梯度范数裁剪阈值（无量纲；0 = 不裁剪）
  accumulation_steps: 1   # 梯度累积；DDP 中间步由 no_sync() 自动跳过 AllReduce
  lr_schedule_per_step: true   # true = 调度器按 optimizer step 更新；false = 按 epoch
  log_interval: 100            # 每 N 个 optimizer step 记录一次日志

  # 验证（全局）
  max_val_batches: 0          # 每个 rank 单次 validation 的最大 forward batch 数；0 = 不限制
  # validation_epoch_interval 与 validation_steps_interval 的互斥语义见 core/trainer/base_trainer.py。
  # 当 validation_steps_interval > 0、save_top_k > 0 且 validation_epoch_interval > 0 时，关闭 epoch 末验证。
  validation_epoch_interval: 1   # 每 N 个 epoch 做一次 epoch 末验证
  validation_steps_interval: 0   # 0 = 关闭步级验证；> 0 时需 save_top_k > 0
  save_top_k: 3                  # 步级验证保留 val_loss 最低的 top-k checkpoint

  # 客观指标（SI-SDR/PESQ/ESTOI）；interval 表示每 N 次 validation 计算一次。
  val_metrics:                   # 在线验证指标；enabled=false 时整块跳过
    enabled: true              # true = 在线计算 val_metrics.metrics 列出的指标
    metrics: [SI-SDR, PESQ, ESTOI]  # 指标集合；每项按固定顺序在所有 rank 聚合
    interval: 1                # 每 N 次 validation 计算一次指标（1 = 每次）
    max_utterances: 2167     # 原始 SCP 2200 条；2–30 s 过滤后为 2167 条，即全局指标上限（各 rank 均分）
    max_utterances_metrics: 2167  # 显式声明：省略时回退 max_utterances
    metrics_workers: 8       # 每个 rank 的侵入式指标进程数

  # 存盘：save_checkpoint_interval 为 epoch 末写盘间隔；save_curve_interval（默认 1）、early_stop_patience（默认 0）省略即取默认值
  save_checkpoint_interval: 1  # epoch 末写盘间隔

# ---- Distributed：DDP 后端与未使用参数策略 ----
distributed:
  backend: nccl                  # DDP 通信后端；单机 GPU 用 nccl
  find_unused_parameters: false  # 单采样率 DeepFilterNet 前向使用全部参数；true 会增加 autograd 遍历并触发 DDP 警告
  nccl_timeout_minutes: 10       # nccl 集合通信超时，单位分钟；超时即中止训练
