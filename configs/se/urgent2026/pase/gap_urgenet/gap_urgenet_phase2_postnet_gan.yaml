# ======================================================================
# Model: GAP-URGENet Phase 2（冻结生成/预测双支路，训练 48 kHz 融合 PostNet）。
# Params: PostNet 4,777,751（4.78 M，保留现有实测值）；完整链为 not measured
#   （四件前级 checkpoint 缺失）；论文完整链 567.76 M 仅作 reference。
# MACs: not measured（未执行完整链或 PostNet 独立 profile）。
# THOP: not measured（未运行）。
# 1 秒复杂度输入/范围: B=1、48 kHz、[1, 48000] float waveform，标称幅度
#   [-1, 1]；两支路内部在 16 kHz 处理，再上采样到 48 kHz 融合。
# FLOPs: not measured；生成支路、Predictor、PostNet、MPD+MBD 均无独立 profile；
#   论文完整链 472.84 GMAC/s 仅作 reference，不能拆作本阶段 FLOPs。
# Trainer MOS boundary: PASEGANTrainer 输出 48 kHz 波形，但 val_metrics.enabled=false；
#   不在线计算 MOS。DNSMOS/UTMOS 必须对完整五件 artifact 严格加载后的音频离线评估。
# Frozen: DeWavLM-Omni + Adapter + Vocoder + Predictor；Trainable: PostNet；
# Discriminator: MPD+MBD，仅训练期参与，不属于推理 artifact。
# Artifact: PostNet.pt；完整 inference chain 为生成支路 + Predictor -> 双路 48 kHz
#   stack -> PostNet -> requested-rate waveform。
# GAP-URGENet Phase 2：训练 48 kHz 双通道 TFGridNetV3 + BandSplit PostNet GAN。
# 冻结 DeWavLM-Omni -> VocosAdapter -> VocosVocoder 生成支路及 Predictor 预测支路
# （no_grad）；双支路上采样到 48 kHz，stack 为 (B, 2, L) 后送入 trainable
# PostNet.forward（n_imics=2，无残差、无软门控）。mel 损失与 MPD+MBD GAN 均在
# 48 kHz 波形上计算。
#
# Source: gap-urgenet/configs/cfg_train_postnet.yaml + models/gap_urgenet.py
#   （冻结双支路见 gap_urgenet.py:49-74；postnet 结构见 cfg:17-23；
#    scheduler 见 cfg:42-46；loss/coeff 见 cfg:48-63）
# Output: PostNet.pt（4.78 M；state_dict 与官方格式逐字兼容，可直接导出）。
#
# Train:
#   python train.py -C configs/se/urgent2026/pase/gap_urgenet/gap_urgenet_phase2_postnet_gan.yaml
# ======================================================================

# ---- meta：随机性 / 精度 / 确定性开关（core/trainer/entry.py、core/trainer/base_trainer.py）----
meta:
  seed: 43              # 官方 cfg_train_postnet.yaml seed；各 rank 模型初始化同种子，数据打乱按 rank 偏移
  allow_no_stft: true   # 模型自带谱前端与 iSTFT，全程 waveform-native，不使用框架 STFT
  use_amp: false        # 官方训练脚本为 fp32（无 autocast）；amp_dtype 仅保留作参考
  amp_dtype: bfloat16   # 家族统一 bfloat16：bf16 与 fp32 同指数范围、无需 GradScaler；本阶段不含 ISTFTHead
  deterministic: false  # false=保留 cuDNN benchmark 自动选算法（默认）；true 关闭 benchmark 并置 cudnn.deterministic

# ---- model：GAN 生成器（冻结双支路 + 48 kHz PostNet）+ 判别器 ----
model:
  # GAN 生成器：可训练主体，推理 artifact 的唯一来源
  generator:
    type: GAPURGENetPostNetGenerator  # 注册名 → tasks/se/models/pase_family/gap_urgenet/gan_wrappers.py
    # 生成器结构参数（显式形参；未知键在构造期 TypeError）
    args:
      # 默认指向官方发布权重；全流程自训时替换为 UniPASE Stage 2/3 与 GAP Phase 1
      # 的对应产物，其中 predictor_ckpt_path 指向 Phase 1 导出的 Predictor.pt。
      encoder_ckpt_path: "tasks/se/models/pase_family/gap_urgenet/open_model_checkpoint/DeWavLM-Omni.pt"  # 生成支路 encoder；仓库内官方权重，缺失时构造期报错
      adapter_ckpt_path: "tasks/se/models/pase_family/gap_urgenet/open_model_checkpoint/Adapter.pt"       # 生成支路 adapter；仓库内官方权重，缺失时构造期报错
      vocoder_ckpt_path: "tasks/se/models/pase_family/gap_urgenet/open_model_checkpoint/Vocoder.pt"       # 生成支路 vocoder；仓库内官方权重，缺失时构造期报错
      predictor_ckpt_path: "tasks/se/models/pase_family/gap_urgenet/open_model_checkpoint/Predictor.pt"   # Phase 1 产物；仓库内官方权重，缺失时构造期报错
      sr_in: 48000                 # Hz；Phase 2 waveform 输入与 PostNet 融合采样率；仅支持 48000，其他值构造期 ValueError
      enable_plc: true             # noisy 特征启用 PLC 掩码（对齐官方 models/gap_urgenet.py:52）
      postnet_kwargs:              # 对齐官方 postnet_config（cfg_train_postnet.yaml:17-23）；整包转发给 TFGridNet
        n_imics: 2                 # 输入通道数；双支路 stack 为 (B, 2, L)，故为 2
        n_layers: 5                # GridNetV3Block 层数
        lstm_hidden_units: 100     # 每层 BLSTM 隐层单元数
        attn_n_head: 4             # 每层注意力头数
        attn_qk_output_channel: 2  # 注意力 Q/K 每头输出通道数
        emb_dim: 96                # 卷积/块隐层维度
        # 官方 models/postnet/tfgrid_cws.py:127-134 做 (x-mean)/std；legacy_centered 与之对齐。
        normalization_mode: legacy_centered
  # GAN 判别器：仅训练期参与，不进入推理 artifact
  discriminator:
    type: PASEDiscriminator        # 多周期 + 多频带组合判别器；仅训练期参与，不进入推理 artifact
    # 判别器结构参数（显式形参；未知键在构造期 TypeError）
    args:
      mpd_reshapes: [2, 3, 5, 7, 11]      # 对齐官方 discriminator_config.mpd；各子判别器波形重采样周期，单位 samples
      mbd_fft_sizes: [2048, 1024, 512]    # FFT size，单位 samples

# ---- data：SE dynamic 数据管线（train/validation 资源 + Layer A–F 仿真）----
data:
  mode: dynamic                  # 枚举：dynamic（SE 在线混合）；offline 变体用 offline
  sample_rate: 48000             # Hz；映射为 target_sr，声学混合直接在 48 kHz 执行

  # 训练 split 声明：clean/noise/wind/RIR 清单路径、时长过滤、固定画布与分层仿真配置
  train:
    speech_scp: "data/shared/urgent26_track1_se_dataset/urgent26_track1_universal_se/urgent26_clean_train.scp"  # clean 语音清单
    # 官方只保留原生 fs >= default_fs（=48 kHz）的源语音（loaders/dataloader.py:71）。
    speech_min_sample_rate: 48000  # Hz；低于该原生采样率的 source 在 Dataset 构造期被过滤
    noise_scp: "data/shared/noise/filter/v2/train_noise_sources.scp"  # 加性噪声清单；prob_target_noise 命中时抽取
    # Layer C-3 背景音乐清单（本 split 级键，不属于 simulation_cfg）；本配方未启用。
    # music_scp: data/ss/background/music/train.scp
    windnoise_scp: "data/shared/noise/filter/v2/train_wind_noise_sources.scp"  # 风噪清单；prob_wind_noise_sidechain=0.05 时按概率采样
    # 当前发布仅有 16/32 kHz 清单；本阶段沿用 16 kHz RIR，加载时重采样至 48 kHz。
    rir_scp: "data/shared/rirs/gpurir_static/gpurir/fs16000/train_rirs.scp"
    filter_min_duration: 1.0     # 秒；源语音最短时长过滤阈值
    filter_max_duration: 30.0    # 秒；源语音最长时长过滤阈值
    num_per_epoch: 4000          # 对齐官方 train_dataset.num_per_epoch；每 epoch 无放回抽样上限
    # Dataset lifecycle: fixed canvas/repeat belongs to this split, not simulation_cfg.
    max_duration_seconds: 4    # 秒；固定画布长度；对齐官方 wav_len
    repeat_to_max_duration: false  # 短源零填充到固定画布；对齐 official 零填充，不做 tile
    # 分层在线仿真配置（Layer A–F）；unknown 键在配置边界 fail-fast
    simulation_cfg:
      # ---- Layer B：场景分支（scene 三路互斥概率）----
      # scene 三路为互斥 multinomial：逐样本单次 uniform 抽样按 CDF 顺序命中（core/data/simulation/scenario_sampler.py），
      # 最后一项 prob_target_noise 为兜底；三者之和必须严格 = 1（abs_tol=1e-8），
      # 且 prob_target_only + prob_noise_only <= 1，违反时 tasks/se/data/dynamic_dataset.py:279-291 在 Dataset 构造期报错。
      # 概率是 nominal 目标比例，realized 计数受 num_per_epoch 有限抽样影响。
      # 未声明的仿真概率字段取 runtime 默认 0.0（core/data/simulation_configs.py:147-294）：
      # prob_timeline、music_ratio、prob_point_source_background、prob_wind_noise_background、
      # prob_array_rotation、prob_microphone_position_jitter、prob_speed_perturb 等。
      # Layer B timeline：多源相对窗口；SE/AEC 单路默认关闭，Layer A gap/留白仍生效。
      # prob_timeline: 0.0            # Layer B 多源相对窗口概率；未声明=0.0
      # overlap_ratio_range: [0.1, 0.5]  # 多源窗口重叠比例范围，无量纲；未声明时取默认
      speech:
        random_start: true        # 对齐 official train_dataset.random_start=True；长句随机起点裁剪
        # Layer A-4 高通预处理（约 70 Hz 的 filtfilt）
        high_pass:
          enabled: false            # Layer A-4 ~70 Hz 高通 filtfilt；对齐官方配置关闭
      # Layer B 场景分支：三路互斥概率，和必须为 1
      scene:
        prob_target_only: 0.0       # Layer B target-only 概率；本配方不采样
        prob_noise_only: 0.0        # Layer B 纯背景概率；本配方不采样
        prob_target_noise: 1.0      # Layer B 目标+噪声概率；三路之和必须为 1（本配置由本项独占）
      # ------------------------------------------------------------------
      # Layer C-0：RIR backend / room geometry / static-moving policy
      # ------------------------------------------------------------------
      # rir_backend: offline  # offline | online；在线时同组 source 共用 room/mic
      # gpurir_room_dim_range_m: [[3.0, 8.0], [3.0, 8.0], [2.5, 3.5]]  # [length, width, height]
      # gpurir_rt60_range_sec: [0.1, 1.0]
      # gpurir_source_distance_range_m: [0.2, 3.0]
      # gpurir_source_height_range_m: [1.1, 1.8]
      # gpurir_mic_height_range_m: [1.0, 1.8]
      # gpurir_enrollment_distance_range_m: [0.05, 0.2]  # 仅 TSE enrollment 近场
      # 稳定服务默认值（source budget/device/omni/timeout/cache）由 core 提供，不在 YAML 重复。
      # Layer C 声学混合：RIR/混响与加性背景
      acoustic:
        # Layer C-0 RIR/混响：卷积概率、moving 策略与监督 target 口径
        rir:
          reverberation_prob: 0.5 # [0, 1]；Layer C-0 RIR 卷积采样概率；0=全部 dry
          moving_prob: 0.0  # [0, 1]；在线 moving RIR 概率；0=全静态（本配方保持关闭，非框架限制）
          # segment_sec 仅用于离线 mono moving PKL 分段卷积；在线 moving 的分段由 trajectory timebase hop 决定。
          target_type: early     # 枚举 early/dry/rts；显式保留 early-RIR 监督目标
          normalize: false       # D-05：重采样后不归一化 RIR，保留静态/移动 RIR 的原始增益（封闭复现例外）
        # Layer C-1/C-2 加性噪声与风噪 side-chain
        background:
          snr_low: -5            # dB；对齐官方 snr_range: [-5, 15] 下界
          snr_high: 15           # dB；对齐官方 snr_range 上界
          prob_wind_noise_sidechain: 0.05 # [0, 1]；对齐官方 simulation_train.yaml:24 的 5% wind noise（Layer C-2 side-chain）
      # 固定 post-mix 顺序：pre-finite -> D-normalize -> D-guard -> E -> F -> task-post-EF -> final-guard -> post-finite；
      # SE 的 task-post-EF 为 no-op；device.enabled（Layer F 总开关）为 false 时只跳过 F，不影响 Layer D/E。
      post_mix:
        # Layer D post-mix 幅度归一化（公共枚举仅 off/joint）
        normalization:
          # off=关闭公共 Layer D-normalize；官方 noisy/clean 各自 peak 归一化见 se.pase_preprocess（target peak 取 schema 默认 [0.5, 0.95]）。
          mode: "off"
      # GAP-URGENet 专属预处理（不进入公共 SimulationConfigs）：noisy/clean 各自 peak 归一化，
      # 且在 Layer E 信道退化之后执行（官方 loaders/dataloader.py 在增广之后归一化）。
      se:
        # GAP-URGENet 专属幅度预处理参数（不进入公共 SimulationConfigs）
        pase_preprocess:
          peak_normalization_mode: separate # 枚举 separate/single；separate=noisy 与 clean 各自按同一 U(0.5,0.95) 目标峰值归一，noise 不参与
          apply_after_channel: true         # true=在 Layer E 信道退化之后执行归一化（对齐官方增广后归一化顺序）
      # Layer E（仅作用于 noisy）：channel.enabled 为总开关，true 时按 num_augmentations 分布与权重抽样，不是逐项全部执行。
      channel:
        enabled: true             # Layer E 总开关；true 时按 num_augmentations 分布与权重抽样
        # runtime 枚举仅支持 bandwidth_limitation/clipping/codec/packet_loss。
        augmentations_name: [bandwidth_limitation, clipping, codec, packet_loss]
        # key=一次选取的增强项数，value=概率；完整分布之和为 1。
        num_augmentations: {0: 0.25, 1: 0.40, 2: 0.20, 3: 0.15}
        # Layer E 各增强项参数（weight 为相对抽样权重）
        augmentations:
          bandwidth_limitation: {weight: 1.0, resample_methods: random, target_sr: 8000}  # target_sr=固定 8 kHz（官方硬编码）；random 随机重采样方法
          clipping: {weight: 1.0, clipping_min_quantile: [0.0, 0.1], clipping_max_quantile: [0.9, 1.0]}  # 分位点范围，无量纲（0–1）
          # codec 增强：按 config 列表随机选一种格式与质量档位
          codec:
            weight: 1.0           # 相对抽样权重
            # codec 备选组合列表（每项 format/encoder/qscale）
            config:
            - {format: mp3, encoder: ~, qscale: [1, 10]}          # ~=不指定 encoder；qscale 为质量档位范围
            - {format: ogg, encoder: [vorbis, opus], qscale: [-1, 10]}  # ogg 随机取 vorbis/opus；qscale=-1 表示后端默认
          # packet_duration_ms 单位为 ms；连续丢包上限按 packet 计；loss rate 为 [0, 1]。
          packet_loss: {weight: 1.0, packet_duration_ms: 20, max_continuous_packet_loss: 10, packet_loss_rate: [0.05, 0.25]}
      # Layer F：observation/device 退化（总开关关闭时整层跳过）
      device:
        enabled: false            # Layer F 总开关；false 跳过 observation/device 退化，不控制 Layer D/E

  # data.validation：验证 split；inherit_simulation=true 时复用 train.simulation_cfg，仅覆盖下列资源键
  validation:
    mode: dynamic                 # 枚举：dynamic
    inherit_simulation: true      # 继承 train.simulation_cfg，仅覆盖下列验证集资源
    # 官方 validation random_start=False；train 为 true，必须显式覆盖。
    simulation_cfg:
      speech:
        random_start: false     # 官方 validation random_start=False；长句固定起点裁剪
    speech_scp: "data/shared/urgent26_track1_se_dataset/urgent26_track1_universal_se/urgent26_clean_val.scp"  # 验证 clean 语音清单
    # 官方只保留原生 fs >= default_fs（=48 kHz）的源语音（loaders/dataloader.py:71）；validation 与 train 同口径。
    speech_min_sample_rate: 48000  # Hz；低于该原生采样率的 source 在 Dataset 构造期被过滤
    rir_scp: "data/shared/rirs/gpurir_static/gpurir/fs16000/val_rirs.scp"   # 验证 RIR 清单（16 kHz 资产，加载时重采样到 48 kHz）
    noise_scp: "data/shared/noise/filter/v2/val_noise_sources.scp"          # 验证噪声清单
    windnoise_scp: "data/shared/noise/filter/v2/val_wind_noise_sources.scp" # 验证风噪清单（继承 train 的 5% 风噪 sidechain）
    num_per_epoch: 800            # 对齐官方 validation_dataset.num_per_epoch；validation 无放回抽样上限

  # data.dataloader：train/val loader 共享参数（验证侧默认沿用，可用 val_num_workers/val_persistent_workers 覆盖）
  dataloader:
    batch_size: 1                 # 对齐官方 train_dataloader.batch_size；每 GPU 计
    val_batch_size: 1             # 官方 validation_dataloader.batch_size=1；显式写出，不沿用 train
    num_workers: 4                # train loader worker 数；验证 loader 默认沿用（0 时强制 persistent_workers=false）
    pin_memory: true              # 锁页内存，加速 host→device 拷贝

# ---- loss：48 kHz Mel + 可选 PESQ/UTMOS-aware 重建损失 ----
loss:
  type: GAPPostNetAwareLoss       # 注册名 → core/losses/pase_family.py::GAPPostNetAwareLoss（内部组合 PaseMultiScaleMelLoss）
  # loss 构造参数（单位与来源见各键注释）
  args:
    sampling_rate: 48000          # Hz；对齐官方 loss.sampling_rate
    n_mels: [5, 10, 20, 40, 80, 160, 320]          # 对齐官方 loss.n_mels；每尺度 mel 通道数（7 个尺度）
    window_lengths: [32, 64, 128, 256, 512, 1024, 2048]  # 单位 samples；须与 n_mels 等长
    mag_weight: 0.0               # 对齐官方 loss.mag_weight；线性幅度谱项权重，0=关闭
    log_weight: 1.0               # 对齐官方 loss.log_weight；对数幅度谱项权重
    pow: 1.0                      # 对齐官方 loss.pow；1.0=幅度、2.0=功率
    weight: 15.0                  # 对齐官方 coeff.recons；mel 项总权重
    window_type: hann             # 对齐官方 loss.window_type；STFT 窗类型
    # 默认关闭；论文引用 TS-URGENet 时两项建议均为 0.5。
    # PESQ 需可选 pytorch-pesq；UTMOS 复用 third_party_scripts/UTMOS 本地源码与权重。
    pesq_weight: 0.0              # [0, +∞)；可微 PESQ-aware 项权重；0=不构造该子损失
    utmos_weight: 0.0             # [0, +∞)；冻结 UTMOS-aware 项权重；0=不构造该子损失

# ---- optimizer：生成器 / 判别器各一个 AdamW ----
optimizer:
  # 生成器优化器
  generator:
    type: AdamW                     # 生成器优化器
    # 生成器 AdamW 超参数
    args:
      lr: 1.0e-6                  # 官方 optimizer.lr 初始值；scheduler.max_lr 后续接管
      betas: [0.8, 0.99]            # Adam β1/β2（官方值）
      weight_decay: 0.01            # 权重衰减系数，无量纲
  # 判别器优化器
  discriminator:
    type: AdamW                     # 判别器优化器
    # 判别器 AdamW 超参数
    args:
      lr: 1.0e-6                    # 官方 optimizer.lr 初始值；scheduler.max_lr 后续接管
      betas: [0.8, 0.99]            # Adam β1/β2
      weight_decay: 0.01            # 权重衰减系数，无量纲

# ---- scheduler：线性 warmup + 余弦退火，按 optimizer step 推进 ----
scheduler:
  # 生成器学习率调度
  generator:
    type: LinearWarmupCosineAnnealing  # 线性 warmup 后余弦退火
    # 生成器调度参数（单位 optimizer steps）
    args:
      warmup_steps: 5000          # 对齐官方值；单位 optimizer steps
      decay_until_step: 60000     # 对齐官方值；单位 optimizer steps
      max_lr: 4.0e-6              # 对齐官方 scheduler.max_lr；峰值学习率
      min_lr: 1.0e-6              # 对齐官方 scheduler.min_lr；退火下界
      zero_based_warmup: true  # 官方 LinearWarmupCosineAnnealingLR：step 0 lr=0
  # 判别器学习率调度
  discriminator:
    type: LinearWarmupCosineAnnealing  # 与生成器同口径
    # 判别器调度参数（单位 optimizer steps）
    args:
      warmup_steps: 5000            # 单位 optimizer steps
      decay_until_step: 60000       # 单位 optimizer steps
      max_lr: 4.0e-6                # 峰值学习率
      min_lr: 1.0e-6                # 退火下界学习率
      zero_based_warmup: true  # 官方 LinearWarmupCosineAnnealingLR：step 0 lr=0

# ---- trainer：GAN 交替训练（PASEGANTrainer）----
trainer:
  type: tasks.se.trainer.pase_gan_trainer.PASEGANTrainer   # 全限定路径：不在 entry.py 短名查找表内
  exp_path: exp/se/gap_urgenet_phase2_postnet_gan           # 输出目录；取配置文件名去 .yaml

  # 官方 trainer.epochs=10 是 resume 续训段口径，在 8 卡、per-GPU batch=1 下只有 10×500=5k steps，退火尚未开始；
  # 从零跑满 scheduler 的等价口径是 120：4000/(1×8)=500 steps/epoch，500×120=60k，覆盖 warmup 5k 与 decay_until_step 60k。
  epochs: 120
  gradient_clip_value: 3.0        # 对齐官方 clip_grad_norm_value；梯度 L2 范数裁剪阈值
  lr_schedule_per_step: true      # true=每个 optimizer step 推进 scheduler（非每 epoch）
  log_interval: 50                # 每多少 optimizer steps 打印一次日志

  # PASEGANTrainer 的 adversarial/feature-matching 权重由 lamda_adv/lamda_feat 控制；
  # adversarial_weight 保持 1.0，避免叠加 GANTrainer 的外层权重。
  adversarial_weight: 1.0         # 必须保持 1.0；对抗项实际权重见 lamda_adv
  lamda_adv: 1.0                  # 对齐官方 coeff.adv；对抗损失权重
  lamda_feat: 1.0                 # 对齐官方 coeff.feat；特征匹配损失权重
  discriminator_steps: 1          # 每个 generator step 对应的判别器 step 数；当前仅允许 1
  generator_steps: 1              # 每个 accumulation boundary 的生成器 step 数；当前仅允许 1

  validation_epoch_interval: 1      # 每多少个 epoch 跑一次 validation（本阶段 epochs=120，故逐 epoch 验证）
  output_clamp: false               # 关闭 [-1,1] clamp，严格对齐官方 PASE 家族训练；仅保留非有限值清零
  max_val_batches: 0              # 0=不限制 validation batch 数
  # 在线客观指标配置（enabled=false 时整段不生效）
  val_metrics:
    enabled: false                # 不在线计算 SI-SDR/PESQ/STOI 或 MOS；有意关闭在线指标

  # 官方验证音频（gap-urgenet/train/train_postnet.py:400-415）：rank 0 且 (epoch < 10 或 epoch%10==0) 且 step<=5；
  # 注意官方条件从绝对 epoch 起算（1-based），不是 start_epoch+10（initial_epoch_reference=zero）。
  # 写 {step}_noisy.wav / {step}_clean.wav / {step}_enh_pred_16k.wav / {step}_enh_gen_16k.wav /
  # {step}_enh_epoch{NNN}.wav，48 kHz；两个 _16k 中间波形实际按 48k 保存（官方同名文件内容为 48k）。
  val_audio:
    enabled: true                 # true=按官方条件保存验证音频；false=整段零开销
    save_initial_epochs: 10       # 官方 epoch < 10（绝对 epoch，1-based）
    save_every_n_epochs: 10       # 官方 epoch % 10 == 0
    initial_epoch_reference: zero  # 枚举 start_epoch/zero；本阶段用 zero（官方 epoch<10）
    max_batches: 5                # 官方 step <= 5

  save_checkpoint_interval: 1     # 对齐官方 trainer.save_checkpoint_interval；逐 epoch 保存

# ---- distributed：DDP 后端与 reducer 选项 ----
distributed:
  backend: nccl                   # DDP 通信后端；GPU 训练固定 nccl
  find_unused_parameters: true    # 必须 true：交替冻结使每个 backward 都有一侧 DDP 包装未被使用；entry 显式设为 false 会报错
