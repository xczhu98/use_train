# ======================================================================
# 配置：PASE Phase 1，预训练 single-stream Vocoder_L24。
# 数据管线：data.mode=dynamic（SE 在线混合；Layer A/B/C 仿真 + Layer D/E/F 后处理）。
# 采样率/帧移：16 kHz；waveform-native（meta.allow_no_stft=true）不使用框架 STFT，
#   内部 iSTFT 由 decoder 的 ISTFTHead 按 model.generator.args.n_fft=1280 /
#   hop_length=320 执行（80 ms 窗 / 20 ms 帧移）。
# 模型：冻结 WavLM-Large L24 encoder，训练 single-stream Vocos decoder 与 MPD+MBD。
# 实现路径：tasks/se/models/pase_family/pase/model.py（PASE、PASEDiscriminator）、
#   tasks/se/models/pase_family/common/vocoder_backend.py（WavLMDec + ISTFTHead）。
# WavLM 依赖：直接依赖 Microsoft WavLM-Large checkpoint。
# Artifact 披露：model.generator.args.wavlm_ckpt_path 指向的
#   ~/use_train_checkpoints/pase/WavLM-Large.pt 已在本机（1.27 GB，SHA256
#   6fb4b3c3...0bf100f）；路径非空即走 safe_torch_load 严格加载，文件缺失会在模型
#   构造期直接报错（allow_random_init 只豁免"路径为空"，不豁免"路径存在但文件缺失"）。
# Params：encoder 约 315.45M（checkpoint 实测）+ decoder 66.69M = 382.14M；
#   保留原数值，未含训练期判别器。
# MACs：not measured；完整链 21.42 GMAC/s 仅为论文 reference。
# FLOPs：not measured；未运行独立 FLOPs profile。
# THOP：not measured（未运行）。
# RTF：not measured（未在本机计时）。
# 复杂度输入口径：B=1，16 kHz，shape=[1, 16000] 的 float waveform，幅度 [-1, 1]；
#   仅计模型前向，图外 STFT/iSTFT 不计入。
# Trainer MOS boundary：PASEGANTrainer 输出波形，但 val_metrics.enabled=false；MOS、DNSMOS、
#   UTMOS 需对阶段 artifact 离线评估（evaluate/eval_pipeline_se.py --audio_quality），
#   训练 loss 不等于 MOS。
# 冻结/可训练：冻结 encoder；训练 decoder；MPD+MBD 仅参与训练，不进入推理 artifact。
# 与其他变体的关键区别：本阶段 output_layer=24 单流、use_dual_stream=false、target-only；
#   Phase 3 用 output_layer=[1, 24] 双流并对 noisy/clean 做 reverb+noise 配对。
# 产物：Vocoder_L24 decoder；本阶段产物不是完整增强系统，完整 PASE 还需要
#   DeWavLM encoder 与 Phase 3 dual-stream vocoder。
# 数据：target-only；对应 official dataloader_clean.py，不混入 noise，RIR 按
#   reverberation_prob 采样。
# Source: cisco-open/pase — pase/configs/cfg_train_vocoder.yaml
# 口径：对齐 official cfg_train_vocoder.yaml 与 train_vocoder.py——seed=43、fp32（无 autocast）、
#   optimizer.lr=1e-4、逐 epoch validation；scheduler.max_lr=2e-4 不变，峰值仍由 scheduler 驱动。
# Train:
#   python train.py -C configs/se/urgent2026/pase/phase1_vocoder_single.yaml
# ======================================================================

# ---- meta：随机性 / 精度 / 确定性开关（core/trainer/entry.py、core/trainer/base_trainer.py）----
meta:
  seed: 43              # 全局随机种子；official train_vocoder.py:43 seed=43；各 rank 模型初始化同种子，数据打乱按 rank 偏移
  allow_no_stft: true   # PASE 为 waveform-native（WavLM encoder + Vocos decoder），不使用框架 STFT
  use_amp: false        # 官方训练脚本为 fp32（无 autocast）；amp_dtype 仅保留作参考
  amp_dtype: bfloat16   # 若手动开启 AMP 必须保持 bfloat16：fp16 会命中 ISTFTHead FFT 的 ComplexHalf 路径
  deterministic: false  # false=保留 cuDNN benchmark 自动选算法（默认）；true 关闭 benchmark 并置 cudnn.deterministic

# ---- model：GAN 生成器 + 判别器（推理 artifact 只含 generator）----
model:
  # GAN 生成器：可训练主体，推理 artifact 的唯一来源
  generator:
    type: PASE           # 注册名 → tasks/se/models/pase_family/pase/model.py::PASE
    # 生成器结构参数（显式形参；未知键在构造期 TypeError）
    args:
      wavlm_ckpt_path: "~/use_train_checkpoints/pase/WavLM-Large.pt"   # WavLM-Large 权重；本机已准备，缺失时构造期报错
      allow_random_init: true  # Phase 1 从头训练 vocoder，尚无 vocoder checkpoint；仅允许训练期随机初始化
      output_layer: 24   # WavLM 第 24 层（top）特征；单流时必须为 int，不能是 list
      feature_norm: batch  # PASE 官方 LayerNorm 口径：F.layer_norm(feat, feat.shape)
      use_dual_stream: false  # 单流 decoder；true 需要 2 元素 output_layer=[1, 24]，否则构造期报错
      frozen_encoder: true    # 冻结 WavLM encoder（requires_grad=False 且 eval 模式）
      frozen_decoder: false   # 本阶段唯一可训练部分：Vocos decoder
      input_channels: 1024    # WavLM-Large 特征维度
      vocoder_dim: 768        # Vocos backbone 隐层维度
      vocoder_intermediate_dim: 2304  # ConvNeXt block 中间维度
      vocoder_num_layers: 12  # ConvNeXt block 层数
      n_fft: 1280        # ISTFTHead FFT 窗长，单位 samples（16 kHz 下 80 ms）
      hop_length: 320    # ISTFTHead 帧移，单位 samples；必须匹配 WavLM 下采样（20 ms）
  # GAN 判别器：仅训练期参与，不进入推理 artifact
  discriminator:
    type: PASEDiscriminator  # 多周期 + 多频带组合判别器；仅训练期参与，不进入推理 artifact
    # 判别器结构参数（显式形参；未知键在构造期 TypeError）
    args:
      mpd_reshapes: [2, 3, 5, 7, 11]   # 多周期判别器各子判别器的波形重采样周期，单位 samples
      mbd_fft_sizes: [2048, 1024, 512] # 多频带判别器各子判别器的 FFT 窗长，单位 samples

# ---- data：SE dynamic 数据管线（train/validation 资源 + Layer A–F 仿真）----
data:
  mode: dynamic                    # 枚举：dynamic（SE 在线混合）；offline 变体用 offline
  sample_rate: 16000               # Hz；训练/验证采样率，同时是仿真 target_sr

  # 训练 split 声明：clean/noise/wind/RIR 清单路径、时长过滤、固定画布与分层仿真配置
  train:
    speech_scp: "data/se/pase/manifests/pase_clean_train.scp"  # official DNS5 LibriVox + LibriTTS + VCTK 过滤清单；target-only 分支的唯一声源
    # target-only 分支不采样 noise/wind；RIR 按 reverberation_prob 抽样，以下共享
    # manifest 仍在 Dataset 初始化时解析。
    noise_scp: "data/se/pase/manifests/dns5_noise_train.scp"  # DNS5 noise；prob_target_only=1.0 时不采样，仅初始化解析
    # Layer C-3 背景音乐清单（本 split 级键，不属于 simulation_cfg）；本配方未启用。
    # music_scp: data/ss/background/music/train.scp
    windnoise_scp: "data/shared/noise/filter/v2/train_wind_noise_sources.scp"  # 风噪清单；prob_wind_noise_sidechain=0 时不采样，仅初始化解析
    rir_scp: "data/se/pase/manifests/dns5_rir_train.scp"   # SLR26/28；official Phase-1 不使用 RIR，保留清单仅为初始化解析
    filter_min_duration: 2.0        # s；源语音最短时长过滤阈值
    filter_max_duration: 30.0       # s；源语音最长时长过滤阈值
    num_per_epoch: 24000            # 每个 epoch 的无放回抽样上限（nominal 目标条数）
    # Dataset lifecycle: fixed canvas/repeat belongs to this split, not simulation_cfg.
    max_duration_seconds: 4       # s；固定画布长度；official wav_len=4
    repeat_to_max_duration: false # 短句右侧补零；对齐 official 零填充，不做 tile
    # 分层在线仿真配置（Layer A–F）；unknown 键在配置边界 fail-fast
    simulation_cfg:
      # ---- Layer B：场景分支（scene 三路互斥概率）----
      # scene 三路为互斥 multinomial：逐样本单次 uniform 抽样按 CDF 顺序命中（core/data/simulation/scenario_sampler.py），
      # 最后一项 prob_target_noise 为兜底；三者之和必须严格 = 1（abs_tol=1e-8），
      # 且 prob_target_only + prob_noise_only <= 1，违反时 tasks/se/data/dynamic_dataset.py:279-291 在 Dataset 构造期报错。
      # 概率是 nominal 目标比例，realized 计数受 num_per_epoch 有限抽样影响。
      # 未声明的仿真概率字段取 runtime 默认 0.0（core/data/simulation_configs.py:147-294）：
      # prob_timeline、music_ratio、prob_point_source_background、prob_wind_noise_background、
      # prob_array_rotation、prob_microphone_position_jitter、prob_speed_perturb 等。
      # Layer B timeline：多源相对窗口；SE/AEC 单路默认关闭，Layer A gap/留白仍生效。
      # prob_timeline: 0.0            # Layer B 多源相对窗口概率；未声明=0.0
      # overlap_ratio_range: [0.1, 0.5]  # 多源窗口重叠比例范围，无量纲；未声明时取默认
      speech:
        random_start: true        # 与 official random_start=True 对齐；长句随机起点裁剪 4 s
        # Layer A-4 高通预处理（约 70 Hz 的 filtfilt）
        high_pass:
          enabled: false            # Layer A-4 ~70 Hz 高通 filtfilt；对齐 official PASE 关闭
      # Layer B 场景分支：三路互斥概率，和必须为 1
      scene:
        prob_target_only: 1.0       # target-only vocoder 预训练，不混入 noise
        prob_noise_only: 0.0       # Layer B 纯背景概率；0 表示不采样纯噪声场景
        prob_target_noise: 0.0      # Layer B 目标+噪声概率；三路之和必须为 1（本配置由前两项独占）
      # Layer C 声学混合：RIR/混响与加性背景
      acoustic:
        # Layer C-0 RIR/混响：卷积概率、moving 策略与监督 target 口径
        rir:
          target_type: dry          # 枚举 early/dry/rts；dry=去混响监督，target-only 阶段保持 dry
          # ------------------------------------------------------------------
          # Layer C-0：RIR backend / room geometry / static-moving policy
          # ------------------------------------------------------------------
          # rir_backend: offline  # offline | online；在线时同组 source 共用 room/mic
          # gpurir_room_dim_range_m: [[3.0, 8.0], [3.0, 8.0], [2.5, 3.5]]  # [length, width, height]
          # gpurir_rt60_range_sec: [0.1, 1.0]
          # gpurir_source_distance_range_m: [0.2, 3.0]
          # gpurir_source_height_range_m: [1.1, 1.8]
          # gpurir_mic_height_range_m: [1.0, 1.8]
          # gpurir_enrollment_distance_range_m: [0.05, 0.2]  # 仅 TSE enrollment 近场
          # 稳定服务默认值（source budget/device/omni/timeout/cache）由 core 提供，不在 YAML 重复。
          reverberation_prob: 0.0 # [0, 1]；official Phase-1 用 dataloader_clean，纯 clean，不采样 RIR
          moving_prob: 0.0  # [0, 1]；在线 moving RIR 概率；0=全静态（本配方保持关闭，非框架限制）
          # segment_sec 仅用于离线 mono moving PKL 分段卷积；在线 moving 的分段由 trajectory timebase hop 决定。
          # 对齐 official dataloader_clean.py：保留 crop/peak normalization，关闭 high-pass、wind 与 Layer E/F degradation。
          normalize: false          # D-05：false 保留 official raw RIR gain（PASE 系列封闭复现例外）；true 为仓库默认 shared-full-peak
        # Layer C-1/C-2 加性噪声与风噪 side-chain
        background:
          prob_wind_noise_sidechain: 0.0  # [0, 1]；非加性风噪 sidechain 概率；0=禁用且零 RNG 消耗
      # Layer D：post-mix amplitude conditioning（normalize → guard）
      post_mix:
        # Layer D post-mix 幅度归一化（公共枚举仅 off/joint）
        normalization:
          mode: "off"               # 枚举 off/joint；off=不做公共 Layer D-normalize，独立归一化见 se.pase_preprocess
      # Layer E：URGENT2026 信道退化（仅作用于 noisy）
      channel:
        enabled: false              # Layer E 总开关；false 跳过整层信道退化（对齐 official clean dataloader）
      # Layer F：observation/device 退化（总开关关闭时整层跳过）
      device:
        enabled: false              # Layer F 总开关；false 跳过 observation/device 退化，不控制 Layer D/E
      # PASE 专属预处理（不进入公共 SimulationConfigs）：target-only 时只归一 clean；
      # 公共 Layer D 的 post_mix.normalization.mode 仅允许 off/joint。
      se:
        # PASE 专属幅度预处理参数（不进入公共 SimulationConfigs）
        pase_preprocess:
          peak_normalization_mode: single # 枚举 separate/single；single=只按 U(0.5,0.95) 归一 clean，target-only 分支下 observation 同步替换为归一后的 clean

  # data.validation：验证 split；inherit_simulation=true 时复用 train.simulation_cfg，仅覆盖下列资源键
  validation:
    mode: dynamic                   # 枚举：dynamic
    inherit_simulation: true        # 继承 data.train.simulation_cfg（同一配置内的仿真继承，非文件级配置继承）
    # 官方 validation 的 random_start=False；train 为 true，必须显式覆盖。
    simulation_cfg:
      speech:
        random_start: false     # 官方 validation random_start=False；长句固定起点裁剪
    speech_scp: "data/se/pase/manifests/pase_clean_val.scp"  # 验证 clean 语音清单；DNS5 前 90 speaker + LibriTTS dev + VCTK 10 speaker
    rir_scp: "data/se/pase/manifests/dns5_rir_val.scp"   # SLR26/28；official Phase-1 不使用 RIR
    noise_scp: "data/se/pase/manifests/dns5_noise_val.scp"          # DNS5 noise validation（本配置不采样）
    windnoise_scp: "data/shared/noise/filter/v2/val_wind_noise_sources.scp" # 验证风噪清单（本配置不采样）
    max_duration_seconds: 4         # s；验证固定画布；official wav_len=4
    repeat_to_max_duration: false   # 短句右侧补零；对齐 official 零填充
    num_per_epoch: 1000             # validation 无放回抽样上限

  # data.dataloader：train/val loader 共享参数（验证侧默认沿用，可用 val_num_workers/val_persistent_workers 覆盖）
  dataloader:
    batch_size: 12                  # source train_dataloader.batch_size (per-GPU)；DDP 下各 rank 独立
    val_batch_size: 1               # 官方 validation_dataloader.batch_size=1；显式写出，不沿用 train
    num_workers: 4                  # train loader worker 数；验证 loader 默认沿用（0 时强制 persistent_workers=false）
    pin_memory: true                # 锁页内存，加速 host→device 拷贝

# ---- loss：多尺度 mel 重建损失 ----
loss:
  type: PaseMultiScaleMelLoss       # 注册名 → core/losses/pase_family.py::PaseMultiScaleMelLoss
  # loss 构造参数（单位与来源见各键注释）
  args:
    sampling_rate: 16000          # Hz；mel 滤波器组采样率
    n_mels: [5, 10, 20, 40, 80, 160, 320]                # 每尺度 mel 通道数（7 个尺度）
    window_lengths: [32, 64, 128, 256, 512, 1024, 2048]  # 每尺度窗长，单位 samples；须与 n_mels 等长
    mag_weight: 0.0                 # 线性幅度谱项权重，无量纲；0=关闭
    log_weight: 1.0                 # 对数幅度谱项权重，无量纲
    pow: 1.0                        # 谱模指数：1.0=幅度、2.0=功率
    weight: 15.0                    # source coeff.recons；该项在 trainer 内的总权重
    window_type: hann               # STFT 窗类型

# ---- optimizer：生成器 / 判别器各一个 AdamW ----
optimizer:
  # 生成器优化器
  generator:
    type: AdamW                     # 生成器优化器
    # 生成器 AdamW 超参数
    args:
      lr: 1.0e-4                    # 官方 optimizer.lr 初始值；实际由 scheduler.max_lr 驱动（峰值 2e-4）
      betas: [0.8, 0.99]            # Adam β1/β2（source 值，非默认 0.9/0.999）
      weight_decay: 0.01            # 权重衰减系数，无量纲
  # 判别器优化器
  discriminator:
    type: AdamW                     # 判别器优化器
    # 判别器 AdamW 超参数
    args:
      lr: 1.0e-4                    # 官方 optimizer.lr 初始值；实际由 scheduler.max_lr 驱动（峰值 2e-4）
      betas: [0.8, 0.99]            # Adam β1/β2
      weight_decay: 0.01            # 权重衰减系数，无量纲

# ---- scheduler：线性 warmup + 余弦退火，按 optimizer step 推进 ----
scheduler:
  # 生成器学习率调度
  generator:
    type: LinearWarmupCosineAnnealing  # 线性 warmup 后余弦退火
    # 生成器调度参数（单位 optimizer steps）
    args:
      warmup_steps: 10000           # 单位 optimizer steps；线性升到 max_lr
      decay_until_step: 200000      # 单位 optimizer steps；余弦退火到该步结束
      max_lr: 2.0e-4                # 峰值学习率
      min_lr: 1.0e-6                # 退火下界学习率
      zero_based_warmup: true  # 官方 LinearWarmupCosineAnnealingLR：step 0 lr=0
  # 判别器学习率调度
  discriminator:
    type: LinearWarmupCosineAnnealing  # 与生成器同口径
    # 判别器调度参数（单位 optimizer steps）
    args:
      warmup_steps: 10000           # 单位 optimizer steps
      decay_until_step: 200000      # 单位 optimizer steps
      max_lr: 2.0e-4                # 峰值学习率
      min_lr: 1.0e-6                # 退火下界学习率
      zero_based_warmup: true  # 官方 LinearWarmupCosineAnnealingLR：step 0 lr=0

# ---- trainer：GAN 交替训练（PASEGANTrainer）----
trainer:
  type: tasks.se.trainer.pase_gan_trainer.PASEGANTrainer   # 全限定路径：不在 entry.py 短名查找表内
  exp_path: exp/se/phase1_vocoder_single                    # 输出目录；取配置文件名去 .yaml（configs/README.md 约定）

  # data.train.num_per_epoch 是无放回抽样上限；上限不小于 Dataset 大小时全量遍历。
  # 实际 optimizer steps 取决于 min(24000, Dataset 大小)、batch、DDP 与 drop_last；
  # 论文/官方 cfg 的 200k 步按 4 卡 × batch 12 × 500 step/epoch 计。
  epochs: 400                       # 论文/官方 cfg：400 epochs × 500 step/epoch（4 卡）= 200k steps
  gradient_clip_value: 3.0          # source clip_grad_norm_value；梯度 L2 范数裁剪阈值
  lr_schedule_per_step: true        # true=每个 optimizer step 推进 scheduler（非每 epoch）
  log_interval: 50                  # 每多少 optimizer steps 打印一次日志

  # GAN 权重（tasks/se/trainer/pase_gan_trainer.py）：对抗/特征匹配权重由 lamda_adv/lamda_feat 承担；
  # adversarial_weight 必须保持 1.0，否则会叠加 GANTrainer 自身权重。
  adversarial_weight: 1.0           # 必须保持 1.0；对抗项实际权重见 lamda_adv
  lamda_adv: 2.0                    # source coeff.adv；对抗损失权重（StuPASE 用 1.0）
  lamda_feat: 1.0                   # source coeff.feat；特征匹配损失权重
  discriminator_steps: 1            # 每个 generator step 对应的判别器 step 数；当前仅允许 1
  generator_steps: 1                # 每个 accumulation boundary 的生成器 step 数；当前仅允许 1

  validation_epoch_interval: 1      # 对齐官方 validation 逐 epoch；每多少个 epoch 跑一次 validation
  output_clamp: false               # 关闭 [-1,1] clamp，严格对齐官方 PASE 家族训练；仅保留非有限值清零
  max_val_batches: 0                # 0=不限制 validation batch 数
  # 在线客观指标配置（enabled=false 时整段不生效）
  val_metrics:
    enabled: false                  # 管线稳定后再开启 SI-SDR/PESQ/STOI；关闭时不建指标池、不算任何客观指标

  # 验证音频（官方 train_vocoder.py:356-363）：rank0、官方 epoch/step 条件写真实/重建波形
  val_audio:
    enabled: true                   # true=按官方条件保存验证音频；false=整段零开销
    save_initial_epochs: 10         # 官方 epoch < start_epoch + 10（1-based）
    save_every_n_epochs: 10         # 官方 epoch % 10 == 0
    initial_epoch_reference: start_epoch  # 枚举 start_epoch/zero；本阶段用 start_epoch
    max_batches: 5                  # 官方 step <= 5

  save_checkpoint_interval: 10      # source trainer.save_checkpoint_interval；每多少 epoch 存一次

# ---- distributed：DDP 后端与 reducer 选项 ----
distributed:
  backend: nccl                     # DDP 通信后端；GPU 训练固定 nccl
  find_unused_parameters: true      # 必须 true：交替冻结使每个 backward 都有一侧 DDP 包装未被使用；entry 显式设为 false 会报错
