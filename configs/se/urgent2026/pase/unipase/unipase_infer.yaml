# ======================================================================
# Model: UniPASE 16 kHz inference（DeWavLM-Omni -> Adapter -> Vocoder；不含 PostNet）。
# 数据管线：仅推理；data.mode=dynamic 只用于 SE 任务路由，不构造训练/验证数据集。
# 采样率/帧移：输入可为任意采样率（模型内部重采样到 16 kHz），输出由 model.args.sr_out
#   决定；waveform-native（meta.allow_no_stft=true），无框架 STFT，iSTFT 在 Vocoder 内部。
# 实现路径：tasks/se/models/pase_family/unipase/unipase_model.py（UniPASE）、
#   tasks/se/models/pase_family/unipase/vocoder.py、.../adapter.py、
#   tasks/se/models/pase_family/unipase/wavlm_frontend_plc.py（DeWavLM-Omni PLC 前端）。
# Params: not measured（缺少三个官方 artifact）；既有 16 kHz 三模块链参考值约 543.7M，
#   论文含 PostNet 完整链参考值为 545.7M。
# MACs: not measured（缺少三个官方 artifact，未执行完整 inference profile）。
# 1 秒复杂度输入/范围：profile 应固定 B=1、1 秒 source waveform、标称幅度 [-1, 1]，
#   并记录 source sample rate；模型内部重采样至 16 kHz，当前输出 16 kHz。
# FLOPs: not measured；论文 encoder/adapter/vocoder 参考值分别为
#   18.08/5.69/5.69 GMAC/s，不能视为本配置实测。
# THOP: not measured（未运行）。
# Trainer MOS boundary: inference-only，无 Trainer；MOS 只能对三件 artifact 严格加载后的
#   输出音频离线评估，缺任一 artifact 时不得报告 MOS。
# Frozen: 全部 inference modules；Trainable: N/A；Discriminator: N/A。
# Artifact: DeWavLM-Omni.pt + Adapter.pt + Vocoder_DWO-L1.pt；完整 inference chain
#   即上述三模块 16 kHz 链，若 sr_out > 16000 还必须显式加入 PostNet.pt。
# UniPASE 推理配置（官方开源权重，waveform-native，免传训练 --checkpoint）
#
# 权重为 HF Xiaobin-Rong/unipase 官方发布版本，位于仓库内
# tasks/se/models/pase_family/unipase/open_model_checkpoint/；配置内三个 artifact 必须实际存在
# 并严格加载。免传的是训练 checkpoint 参数，不是免权重运行。
# 数值核对需官方源码 checkout、对应权重与受控后端；组件 parity 核对记录见
# tests/test_unipase_official_parity.py（max_abs_diff=0.0），端到端脚本以 SI-SNR > 60 dB 判定。
#
# 用法：
#   PYTHONPATH=. python inference.py \
#       -C configs/se/urgent2026/pase/unipase/unipase_infer.yaml \
#       --input_dir <noisy_dir> --output_dir <out_dir>
# 长音频（> 20 s）建议加 --chunk_seconds 8（分块中点拼接，等价官方 inference_long）
#
# 说明：
# - sr_out: 16000 → 输出 16 kHz，且不加载 PostNet；改为 48000 则必须提供
#   postnet_ckpt_path，并走 PostNet 带宽扩展。
# - enable_plc: true → 启用丢包补偿（20 ms 全零包检测 + mask_emb 替换）。
# - 模型内部支持任意输入采样率（自动重采样到 16 kHz 处理）。
# ======================================================================

# ---- meta：随机性 / 推理标记 ----
meta:
  seed: 42              # 全局随机种子；推理无训练随机性，仅为接口一致性保留
  allow_no_stft: true   # waveform-native 模型：权重由 from_pretrained 注入，免 --checkpoint
  inference_only: true  # 纯推理配置；无 train/validation/trainer/loss
  deterministic: false  # false=不做确定性算法约束（默认）；inference-only 无 Trainer，此键不参与训练路径

# ---- data：仅保留任务路由字段 ----
data:
  mode: dynamic         # 仅保留 SE 任务路由；不声明训练或验证数据

# ---- model：三模块 16 kHz 推理链 ----
model:
  type: UniPASE          # 注册名 → tasks/se/models/pase_family/unipase/unipase_model.py
  # 推理链 artifact 路径与运行参数（显式形参；未知键在构造期 TypeError）
  args:
    dewavlm_ckpt_path: "tasks/se/models/pase_family/unipase/open_model_checkpoint/DeWavLM-Omni.pt"   # Stage 1 产物（PLC encoder）；仓库内官方权重，缺失时构造期报错
    adapter_ckpt_path: "tasks/se/models/pase_family/unipase/open_model_checkpoint/Adapter.pt"        # Stage 3 产物（VocosAdapter）；仓库内官方权重，缺失时构造期报错
    vocoder_ckpt_path: "tasks/se/models/pase_family/unipase/open_model_checkpoint/Vocoder_DWO-L1.pt" # Stage 2 产物（Vocos vocoder）；仓库内官方权重，缺失时构造期报错
    sr_out: 16000        # 输出采样率，单位 Hz；16k 不加载 PostNet，>16000 时必须显式增加 postnet_ckpt_path
    enable_plc: true     # 启用丢包补偿（20 ms 全零包检测 + mask_emb 替换）
