# ======================================================================
# Model: UniPASE Stage 1 DeWavLM-Omni 蒸馏（冻结 clean teacher + 可训练 PLC student）。
# Params: not measured（缺少 WavLM checkpoint）；既有结构参考值约 315.45M/副本；
#   训练时包含双副本，推理 artifact 仅包含 student。
# MACs: not measured（缺少 WavLM checkpoint，未执行双分支 profile）。
# 1 秒复杂度输入/范围：teacher/student 各 B=1、16 kHz、[1, 16000] float waveform，
#   标称幅度 [-1, 1]；student 另消费 20 ms 零包/PLC mask 语义。
# FLOPs: not measured；论文 encoder 参考值为 18.08 GMAC/s，不能代表双分支训练开销。
# THOP: not measured（未运行）。
# Trainer MOS boundary: DualInputLossTrainer 只消费 scalar feature MSE，不生成增强音频；
#   因此不能计算或解释任何音频 MOS/PESQ/STOI（trainer.val_audio 只写官方验证样例）。
# Frozen: clean WavLM teacher；Trainable: DeWavLM-Omni PLC student；Discriminator: N/A。
# Artifact: DeWavLM-Omni.pt；完整 inference chain: DeWavLM-Omni -> Adapter -> Vocoder
#   -> optional PostNet，本阶段 artifact 单独不输出增强音频（validation 样例见 trainer.val_audio）。
# Stage 边界：冻结 clean teacher（mask=False）对可训练 PLC student（noisy，mask=True，丢包区由 mask_emb 替换），
#   只做 layer-24 特征 MSE，不含 GAN 与 vocoder；产物供 Stage 2/3/4 冻结使用。
#
# Source: unipase/configs/cfg_train_dewavlm.yaml + train/train_dewavlm.py
#   (teacher/student 均由 WavLM-Large.pt 初始化，output_layer=24；
#    学生 mask=True 见 train_dewavlm.py:215，teacher mask=False 见 :218)
#
# Train:
#   python train.py -C configs/se/urgent2026/pase/unipase/unipase_phase1_dewavlm_omni.yaml
# ======================================================================

# ---- meta：随机性 / 精度 / 确定性开关（core/trainer/entry.py、core/trainer/base_trainer.py）----
meta:
  seed: 34                        # source train_dewavlm.py:29 seed；各 rank 模型初始化同种子，数据打乱按 rank 偏移
  allow_no_stft: true             # 本阶段输出为 WavLM 特征 MSE，全程 waveform-native，不使用框架 STFT
  use_amp: false                  # 官方训练脚本为 fp32（无 autocast）；amp_dtype 仅保留作参考
  amp_dtype: bfloat16             # 家族统一 bfloat16：bf16 与 fp32 同指数范围、无需 GradScaler；本阶段不含 ISTFTHead
  deterministic: false            # false=保留 cuDNN benchmark 自动选算法（默认）；true 关闭 benchmark 并置 cudnn.deterministic

# ---- model：双副本 WavLM 蒸馏（teacher 冻结 / PLC student 可训练）----
model:
  type: DeWavLMDistillModel       # 注册名 → tasks/se/models/pase_family/common/dewavlm_distill.py
  # 模型结构参数（显式形参；未知键在构造期 TypeError）
  args:
    teacher_ckpt_path: "~/use_train_checkpoints/pase/WavLM-Large.pt"  # 冻结 teacher 初始化权重；本机已就位，缺失时构造期报错
    student_ckpt_path: "~/use_train_checkpoints/pase/WavLM-Large.pt"  # 可训练 student 初始化权重；同上，缺失即报错
    output_layer: 24              # 参与 MSE 的 WavLM 层号；本阶段为单层 int 24（不是多层的 list）
    feature_norm: per_sample      # UniPASE 官方 LayerNorm 口径：F.layer_norm(feat, feat.shape[1:])
    use_plc_frontend: true        # 学生换 WavLM_feat_PLC(enable_plc=True)，mask=True

# ---- data：SE dynamic 数据管线（train/validation 资源 + Layer A–F 仿真）----
data:
  mode: dynamic                    # 枚举：dynamic（SE 在线混合）；offline 变体用 offline
  sample_rate: 16000               # Hz；训练/验证采样率，同时是仿真 target_sr

  # 训练 split 声明：clean/noise/wind/RIR 清单路径、时长过滤、固定画布与分层仿真配置
  train:
    speech_scp: "data/shared/urgent26_track1_se_dataset/urgent26_track1_universal_se/urgent26_clean_train.scp"  # clean 语音清单；本阶段 noisy/clean 配对监督
    # 官方只保留原生 fs >= default_fs 的源语音（loaders/dataloader.py:71）。
    speech_min_sample_rate: 16000  # Hz；低于该原生采样率的 source 在 Dataset 构造期被过滤
    noise_scp: "data/shared/noise/filter/v2/train_noise_sources.scp"  # 加性噪声清单；prob_target_noise 命中时抽取
    # Layer C-3 背景音乐清单（本 split 级键，不属于 simulation_cfg）；本配方未启用。
    # music_scp: data/ss/background/music/train.scp
    windnoise_scp: "data/shared/noise/filter/v2/train_wind_noise_sources.scp"  # 风噪清单；prob_wind_noise_sidechain=0.05 时按概率采样
    rir_scp: "data/shared/rirs/gpurir_static/gpurir/fs16000/train_rirs.scp"   # 16 kHz 静态 gpuRIR 清单；reverberation_prob 命中时抽取
    # 风噪 sidechain 概率对齐官方 simulation_train.yaml:24 的 5% wind noise；
    # manifest 必须存在，命中时按 Layer C-2 非加性 sidechain 注入。
    filter_min_duration: 2.0        # s；源语音最短时长过滤阈值
    filter_max_duration: 30.0       # s；源语音最长时长过滤阈值
    num_per_epoch: 40000          # source cfg_train_dewavlm.yaml train_dataset.num_per_epoch；每 epoch 无放回抽样上限
    # Dataset lifecycle: fixed canvas/repeat belongs to this split, not simulation_cfg.
    max_duration_seconds: 4       # s；固定画布长度；source wav_len: 4
    repeat_to_max_duration: false  # 短源零填充到固定画布；对齐 official 零填充，不做 tile
    # 分层在线仿真配置（Layer A–F）；unknown 键在配置边界 fail-fast
    simulation_cfg:
      # ---- Layer B：场景分支（scene 三路互斥概率）----
      # scene 三路为互斥 multinomial：逐样本单次 uniform 抽样按 CDF 顺序命中（core/data/simulation/scenario_sampler.py），
      # 最后一项 prob_target_noise 为兜底；三者之和必须严格 = 1（abs_tol=1e-8），
      # 且 prob_target_only + prob_noise_only <= 1，违反时 tasks/se/data/dynamic_dataset.py:279-291 在 Dataset 构造期报错。
      # 概率是 nominal 目标比例，realized 计数受 num_per_epoch 有限抽样影响。
      # 未声明的仿真概率字段取 runtime 默认 0.0（core/data/simulation_configs.py:147-294）：
      # prob_timeline、music_ratio、prob_point_source_background、prob_wind_noise_background、
      # prob_array_rotation、prob_microphone_position_jitter、prob_speed_perturb 等。
      # Layer B timeline：多源相对窗口；SE/AEC 单路默认关闭，Layer A gap/留白仍生效。
      # prob_timeline: 0.0            # Layer B 多源相对窗口概率；未声明=0.0
      # overlap_ratio_range: [0.1, 0.5]  # 多源窗口重叠比例范围，无量纲；未声明时取默认
      speech:
        random_start: true        # 对齐 official train_dataset.random_start=True；长句随机起点裁剪
        # Layer A-4 高通预处理（约 70 Hz 的 filtfilt）
        high_pass:
          enabled: false            # Layer A-4 ~70 Hz 高通 filtfilt；对齐官方配置关闭
      # Layer B 场景分支：三路互斥概率，和必须为 1
      scene:
        prob_target_only: 0.0       # Layer B target-only 概率；本阶段不采样
        prob_noise_only: 0.0        # Layer B 纯背景概率；本阶段不采样
        prob_target_noise: 1.0      # Layer B 目标+噪声概率；三路之和必须为 1（本配置由本项独占）
      # ------------------------------------------------------------------
      # Layer C-0：RIR backend / room geometry / static-moving policy
      # ------------------------------------------------------------------
      # rir_backend: offline  # offline | online；在线时同组 source 共用 room/mic
      # gpurir_room_dim_range_m: [[3.0, 8.0], [3.0, 8.0], [2.5, 3.5]]  # [length, width, height]
      # gpurir_rt60_range_sec: [0.1, 1.0]
      # gpurir_source_distance_range_m: [0.2, 3.0]
      # gpurir_source_height_range_m: [1.1, 1.8]
      # gpurir_mic_height_range_m: [1.0, 1.8]
      # gpurir_enrollment_distance_range_m: [0.05, 0.2]  # 仅 TSE enrollment 近场
      # 稳定服务默认值（source budget/device/omni/timeout/cache）由 core 提供，不在 YAML 重复。
      acoustic:
        # Layer C-0 RIR/混响：卷积概率、moving 策略与监督 target 口径
        rir:
          reverberation_prob: 0.5 # source simulation_train.yaml:38；[0, 1] RIR 卷积采样概率；0=全部 dry
          moving_prob: 0.0  # [0, 1]；在线 moving RIR 概率；0=全静态（本配方保持关闭，非框架限制）
          # segment_sec 仅用于离线 mono moving PKL 分段卷积；在线 moving 的分段由 trajectory timebase hop 决定。
          target_type: dry           # 枚举 early/dry/rts；官方 loaders/dataloader.py:203-205 注释掉 early-RIR，clean 为 dry target
          normalize: false         # D-05：RIR 卷积前不做峰值归一化，保留原始 RIR 增益（封闭复现例外）
        # Layer C-1/C-2 加性噪声与风噪 side-chain
        background:
          snr_low: -5               # dB；source snr_range: [-5, 15] 下界
          snr_high: 15              # dB；source snr_range 上界
          prob_wind_noise_sidechain: 0.05  # [0, 1]；非加性风噪 sidechain 概率；对齐官方 simulation_train.yaml:24 的 5% wind noise
      # Layer D：post-mix amplitude conditioning（normalize → guard）
      post_mix:
        # Layer D post-mix 幅度归一化（公共枚举仅 off/joint）
        normalization:
          mode: "off"                 # 公共枚举仅 off/joint；off=关闭公共 D-normalize，官方 noisy/clean 各自 peak 归一化见 se.pase_preprocess
      # UniPASE 专属预处理（不进入公共 SimulationConfigs）：noisy/clean 各自 peak 归一化，
      # 且在 Layer E 信道退化之后执行（官方 loaders/dataloader.py:327-330 在增广之后归一化）。
      se:
        # UniPASE 专属幅度预处理参数（不进入公共 SimulationConfigs）
        pase_preprocess:
          peak_normalization_mode: separate # 枚举 separate/single；separate=noisy 与 clean 各自按同一 U(0.5,0.95) 目标峰值归一，noise 不参与
          apply_after_channel: true         # true=在 Layer E 信道退化之后执行归一化（对齐官方增广后归一化顺序）
      # ------------------------------------------------------------------
      # Layer E 信道退化：channel.enabled（canonical prob_channel_enabled）为总开关；增强名称枚举限于 bandwidth_limitation/
      # clipping/codec/packet_loss；PLC 训练要求 noisy 中存在 20 ms 零化丢包区域，否则 mask 路径不生效（对齐官方 simulation_train.yaml:40-67）。
      # ------------------------------------------------------------------
      channel:
        enabled: true             # Layer E 总开关；true 时按 num_augmentations 分布与权重抽样（PLC 训练必须开启）
        augmentations_name: [bandwidth_limitation, clipping, codec, packet_loss]  # runtime 枚举仅支持这四类
        num_augmentations: {0: 0.25, 1: 0.40, 2: 0.20, 3: 0.15} # source num_augmentations；key=一次选取的增强项数，value=概率；分布之和为 1
        # Layer E 各增强项参数（weight 为相对抽样权重）
        augmentations:
          bandwidth_limitation: {weight: 1.0, resample_methods: random, target_sr: 8000}  # target_sr=固定 8 kHz 有效带宽（官方硬编码）；resample_methods=random 随机重采样方法
          clipping: {weight: 1.0, clipping_min_quantile: [0.0, 0.1], clipping_max_quantile: [0.9, 1.0]}  # 分位点范围，无量纲（0–1）
          # codec 增强：按 config 列表随机选一种格式与质量档位
          codec:
            weight: 1.0           # 相对抽样权重
            # codec 备选组合列表（每项 format/encoder/qscale）
            config:
            - {format: mp3, encoder: ~, qscale: [1, 10]}          # ~=不指定 encoder；qscale 为质量档位范围
            - {format: ogg, encoder: [vorbis, opus], qscale: [-1, 10]}  # ogg 随机取 vorbis/opus；qscale=-1 表示后端默认
          packet_loss: {weight: 1.0, packet_duration_ms: 20, max_continuous_packet_loss: 10, packet_loss_rate: [0.05, 0.25]}  # 包长单位 ms；连续丢包上限按包计；丢包率无量纲
      # Layer F：observation/device 退化（总开关关闭时整层跳过）
      device:
        enabled: false                            # Layer F 总开关关闭；不控制 Layer D/E

  # data.validation：验证 split；inherit_simulation=true 时复用 train.simulation_cfg，仅覆盖下列资源键
  validation:
    mode: dynamic                   # 枚举：dynamic
    inherit_simulation: true        # 继承 data.train.simulation_cfg（同一配置内的仿真继承，非文件级配置继承）
    # 官方 validation random_start=False；train 为 true，必须显式覆盖。
    simulation_cfg:
      speech:
        random_start: false       # 官方 validation random_start=False；长句固定起点裁剪
    speech_scp: "data/shared/urgent26_track1_se_dataset/urgent26_track1_universal_se/urgent26_clean_val.scp"  # 验证 clean 语音清单
    # 官方只保留原生 fs >= default_fs 的源语音（loaders/dataloader.py:71）；validation 与 train 同口径。
    speech_min_sample_rate: 16000  # Hz；低于该原生采样率的 source 在 Dataset 构造期被过滤
    rir_scp: "data/shared/rirs/gpurir_static/gpurir/fs16000/val_rirs.scp"   # 验证 RIR 清单
    noise_scp: "data/shared/noise/filter/v2/val_noise_sources.scp"          # 验证噪声清单
    windnoise_scp: "data/shared/noise/filter/v2/val_wind_noise_sources.scp" # 验证风噪清单（继承 train 的 5% 风噪 sidechain）
    num_per_epoch: 1000           # source validation_dataset.num_per_epoch；validation 无放回抽样上限

  # data.dataloader：train/val loader 共享参数（验证侧默认沿用，可用 val_num_workers/val_persistent_workers 覆盖）
  dataloader:
    batch_size: 20                # source train_dataloader.batch_size (per-GPU)；DDP 下各 rank 独立
    val_batch_size: 1             # 官方 validation dataloader.batch_size=1；验证 loader 独立 batch，不沿用 train
    num_workers: 4                # train loader worker 数；验证 loader 默认沿用（0 时强制 persistent_workers=false）
    pin_memory: true              # 锁页内存，加速 host→device 拷贝

# ---- loss：占位 loss，真实特征 MSE 在模型 forward 内计算 ----
loss:
  type: ScalarPassthroughLoss   # 占位 loss：特征 MSE 由 DualInputLossTrainer 在 model.forward() 内计算

# ---- optimizer：单优化器 AdamW ----
optimizer:
  type: AdamW                       # 单优化器（teacher 冻结，只更新 PLC student）
  # AdamW 超参数
  args:
    lr: 2.0e-6                    # 官方 optimizer.lr 初始值；scheduler.max_lr 后续接管
    betas: [0.8, 0.99]            # source train_dewavlm.py:77；Adam β1/β2
    weight_decay: 0.01            # 权重衰减系数，无量纲

# ---- scheduler：线性 warmup + 余弦退火，按 optimizer step 推进 ----
scheduler:
  type: LinearWarmupCosineAnnealing  # 线性 warmup 后余弦退火
  # warmup/退火参数（单位 optimizer steps）
  args:
    warmup_steps: 10000           # source scheduler.warmup_steps；单位 optimizer steps
    decay_until_step: 110000      # source scheduler.decay_until_step；单位 optimizer steps
    max_lr: 1.0e-4                # source scheduler.max_lr；峰值学习率
    min_lr: 1.0e-6                # 退火下界学习率
    zero_based_warmup: true  # 官方 LinearWarmupCosineAnnealingLR：step 0 lr=0

# ---- trainer：双输入特征蒸馏训练（DualInputLossTrainer）----
trainer:
  type: tasks.se.trainer.dual_input_loss_trainer.DualInputLossTrainer  # 双输入：noisy 送 student、clean 送 teacher
  exp_path: exp/se/unipase_phase1_dewavlm_omni              # 输出目录；取配置文件名去 .yaml

  # 与 pase 目录其它配置一致：保留源码字面 epochs；epoch 语义差异见
  # configs/se/urgent2026/pase/README.md「epoch 语义」说明。
  epochs: 200                       # source trainer.epochs
  gradient_clip_value: 3.0          # source clip_grad_norm_value；梯度 L2 范数裁剪阈值
  lr_schedule_per_step: true        # true=每个 optimizer step 推进 scheduler
  log_interval: 50                  # 每多少 optimizer steps 打印一次日志

  validation_epoch_interval: 1      # 每多少个 epoch 跑一次 validation；官方逐 epoch 验证
  output_clamp: false               # 关闭 [-1,1] clamp，严格对齐官方 PASE 家族训练；仅保留非有限值清零
  max_val_batches: 0                # 0=不限制 validation batch 数
  # 在线客观指标配置（enabled=false 时整段不生效）
  val_metrics:
    enabled: false                  # 输出是 WavLM 特征 MSE，不是音频，故不计算音频指标；有意关闭在线指标

  # 官方验证音频（unipase/train/train_dewavlm.py:260-290）：rank 0 且 (epoch < start_epoch+10 或 epoch%10==0) 且 step<=10；
  # 写 {step}_noisy.wav / {step}_clean.wav / {step}_enh_epoch{NNN}.wav / {step}_ref_epoch{NNN}.wav，16 kHz。
  # 目录默认 <trainer.exp_path>/samples；uid 用 validation 循环的 1-based step（SEBatch 不含数据集 id）。
  val_audio:
    enabled: true                   # true=按官方条件保存验证音频；false=整段零开销
    save_initial_epochs: 10         # 官方 epoch < start_epoch + 10
    save_every_n_epochs: 10         # 官方 epoch % 10 == 0
    initial_epoch_reference: start_epoch  # 枚举 start_epoch/zero；本阶段用 start_epoch
    max_batches: 10                 # 官方 step <= 10
    vocoder_ckpt_path: "tasks/se/models/pase_family/unipase/open_model_checkpoint/Vocoder_WavLM-L24.pt"  # 官方 cfg_train_dewavlm.yaml 的 Vocoder_WavLM-L24（input_channels=1024）
    vocoder_kind: unipase           # 枚举 stupase/unipase；本阶段用 UniPASE VocosVocoder

  save_checkpoint_interval: 10      # 每多少 epoch 存一次 checkpoint

# ---- distributed：DDP 后端与 reducer 选项 ----
distributed:
  backend: nccl                     # DDP 通信后端；GPU 训练固定 nccl
  find_unused_parameters: true      # 官方 train_dewavlm.py 使用 true：无丢包 batch 的 PLC mask_emb 可能无梯度
