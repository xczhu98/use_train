# ======================================================================
# 实验配置：MeanFlowSE，VoiceBank-DEMAND，离线预混（16 kHz）
# ======================================================================
# 模型：MeanFlowSE（项目自研纯 PyTorch NCSN++ 风格 backbone，非官方结构复刻）
# Params：local 42.3852M total；paper/reference not measured（当前本地结构不声明官方 checkpoint/参数口径兼容）
# 1 秒输入 MACs：local 84.7736G @ 16 kHz（THOP，partial/unverified；可能不计 STFT/iSTFT 与部分复数算子）；paper/reference not measured（结构不等价）
# 独立 FLOPs：not measured（本地审计仅统计 MACs，未运行独立 FLOPs profiler）
# Trainer MOS boundary：Trainer 只计算侵入式客观指标；DNSMOS/NISQA/UTMOS/SCOREQ 等须经 evaluate 离线计算
# 论文/参考：MeanFlowSE；上游固定 commit liduojia1/MeanFlowSE@6e0fe649e9916046ca1147343fb4a2fb69f87e19
# 本地口径：当前 YAML 经 tools/model_tools/audit_metrics.py 按 1 秒输入复核；参数名与 shape 不声明官方 checkpoint 兼容
# 本配置保留官方 510/128/510、hann、center=True、256 frequency bins preset。
# 训练集不重复短音频；task-local trainer 按 noisy peak 联合归一化配对波形，
# 并把短样本对称零补齐到 32640 samples。这是官方数据语义的项目适配，
# 通用 offline dataset/collate 本身不提供官方固定画布契约。
# 数据：VCTK-DEMAND 预混配对 clean/noisy 四列 SCP；offline 无在线仿真随机性
# 推荐入口：python train.py -C configs/se/voicebank_demand/meanflowse_ncsnpp_offline.yaml
# 模型实现：tasks/se/models/generative/meanflowse/model.py（MeanFlowSE 类）
# Trainer 实现：tasks/se/trainer/meanflowse_trainer.py（MeanFlowSETrainer，生成式双谱 objective）
# 数据实现：core/data/offline_dataset.py（offline 配对 Dataset）+ MeanFlowSETrainer 的固定画布后处理
# ======================================================================

# ---- meta：全局训练超参（随机种子、精度开关、EMA、cuDNN 行为）----
meta:
  seed: 42               # 全局随机种子；Trainer 由此派生 validation seed 与 DataLoader worker seed（runtime 默认 42）
  use_amp: false         # 关闭 AMP：MeanFlow 的 JVP/有限差分与二阶梯度在 BF16 下未验证，本配置保持 FP32
  use_ema: true          # 开启 EMA：生成式模型长训练下 EMA 权重更稳，是官方配方的项目适配
  ema_decay: 0.999       # EMA 衰减系数（无量纲，仅 use_ema=true 生效）；越高越平滑、跟踪越慢
  compile_model: false   # 关闭 torch.compile：NCSN++ 的 F.interpolate/cat 路径易产生 graph breaks，收益未实测
  # 关闭 cudnn 确定性（runtime 默认 false）；开启会牺牲吞吐，仅在需要逐 bit 复现时设 true
  deterministic: false

# ---- stft：框架负责 wav<->spec；MeanFlowSE 只处理复谱 ----
stft:
  n_fft: 510             # FFT 长度（采样点），16 kHz 下 31.875 ms；官方 510/128/510 preset，频率轴 F = 256
  hop_length: 128        # 帧移（采样点），16 kHz 下 8 ms；官方 preset
  win_length: 510        # 窗长（采样点）；模型要求 win_length == n_fft，否则构造期报错
  window: hann           # 分析窗类型；模型仅接受 hann，其他窗名直接报错
  center: true           # 居中补齐；模型要求 center=True，否则构造期报错；带来 255 samples lookahead

# ---- model：MeanFlowSE（tasks/se/models/generative/meanflowse/model.py）----
model:
  type: MeanFlowSE       # registry 名称（@MODEL_REGISTRY.register("MeanFlowSE")）
  # n_fft/hop_length/win_length/window/center 由 build_model 从顶层 stft 注入；args 只放模型自身超参
  args:
    # 校验顶层 stft 必须为官方 510/128/510 + hann + center=True，偏离即报错
    strict_preset: true  # 开启官方 STFT preset 硬校验；false 时只做几何/窗名的通用校验
    spec_factor: 0.15    # 谱压缩线性因子（> 0，无量纲）；与 spec_abs_exponent 组成 |x|^e * factor 的幅度归一化
    spec_abs_exponent: 0.5  # 谱压缩指数（> 0，无量纲）；0.5 等价开方压缩，缩小动态范围
    sigma_min: 0.0       # 噪声调度下界（无量纲）；须满足 0 <= sigma_min <= sigma_max
    sigma_max: 0.487     # 噪声调度上界（无量纲）；官方 0.487，与 sigma_min 共同决定 velocity 目标尺度
    t_eps: 0.03          # 时间下界（无量纲）；须满足 0 < t_eps < t_max；采样 t 从 [t_eps, t_max) 均匀抽取
    t_max: 1.0           # 时间上界（无量纲）；推理起点 t = t_max，终点 r = t_eps
    mf_weight_final: 0.25  # MeanFlow 项最终权重（[0,1]，无量纲）；warmup 结束后恒为该值
    mf_warmup_frac: 0.5  # MeanFlow 权重 warmup 占总训练进度比例（>= 0，无量纲）；0.5 = 前 50% 进度线性升权
    mf_delta_gamma_start: 8.0  # 时间差 delta = t - r 的采样 gamma 起始值（> 0，无量纲）；u = rand^gamma，gamma>1 使 u 偏小、delta 偏小（r 更接近 t），即早期偏向小时间差
    mf_delta_gamma_end: 1.0    # gamma 终止值（> 0，无量纲）；warmup 后 gamma=1 即 delta 均匀采样
    mf_delta_warmup_frac: 0.7  # gamma 从 start 过渡到 end 的进度比例（>= 0，无量纲）；0 表示直接用 end
    # 概率字段三件套：
    #  (a) 独立伯努利门，不与任何互斥组共享；可与同批次其他采样（t/r、sigma）共现，无“和必须为 1”约束；
    #  (b) 抽样方式：逐元素 torch.rand_like(t) < prob（逐样本逐帧 rng），命中则强制 r = t（MeanFlow 退化为瞬时速度目标）；
    #      nominal = 配置值 0.1；realized 命中率随 batch/帧数在 0.1 附近波动，不保证每批精确 10%；
    #  (c) 取值域 [0,1]，越界在构造期 fail-fast（model.py:388），runtime 默认 0.1（model.py:291），消费点 model.py:519。
    mf_r_equals_t_prob: 0.1  # 强制 r=t 的概率（无量纲，[0,1]）
    mf_jvp_clip: 5.0     # JVP 方向范数裁剪上限（> 0，无量纲）；防止有限差分方向爆炸
    mf_jvp_eps: 0.001    # 有限差分步长（> 0，无量纲）；按输入幅度 scale 缩放，过小会放大数值噪声
    mf_jvp_chunk: 1      # JVP 分块 batch 大小（>= 0，单位：样本）；1 = 逐样本计算以省显存，<= 0 表示整批一次
    mf_skip_weight_thresh: 0.05  # MeanFlow 权重跳过阈值（>= 0，无量纲）；权重低于该值的样本不计入该项
    mf_first_order_coef: 0.5     # 一阶项系数（无量纲）；target = velocity - coef * delta * jvp，控制 JVP 修正强度
    # 模型本地 prior seed 会自然进入推理 artifact 的 config fingerprint。
    inference_seed: 42   # 推理期先验/采样随机种子（非负整数）；影响可复现的推理 artifact 身份
    # 与训练/validation 一致：公共推理在 STFT 前按 noisy peak 归一化，iSTFT 后还原。
    inference_peak_normalization: true  # 开启推理 noisy-peak 归一化；false 则要求调用方预先归一化
    nf: 128              # NCSN++ 基础通道数（>= 4）；ch_mult 各项乘以它得到各层通道
    ch_mult: [1, 1, 2, 2, 2, 2, 2]  # 7 层通道倍率（均为正整数）；长度决定 pad_multiple = 2^(len-1) = 64
    num_res_blocks: 2    # 每层残差块数（>= 1）
    dropout: 0.0         # 残差块 dropout 概率（[0,1)，无量纲）；0 = 关闭，生成式训练常用 0
    fourier_scale: 16.0  # 高斯傅里叶时间嵌入的尺度（无量纲）；须为偶数字嵌入维度下的正数
    attention_heads: 4   # bottleneck 空间自注意力头数（正整数）；必须整除该层通道数

# ---- data：VoiceBank-DEMAND 预混配对数据 ----
data:
  mode: offline          # 路由字段：offline 读磁盘配对 SCP，不做在线仿真（normalize_data_mode fail-fast）
  sample_rate: 16000     # 目标采样率 Hz；与 SCP 内嵌 fs 一致
  train:                 # 训练 split：配对 clean/noisy SCP 与画布生命周期参数（Dataset 级）
    clean_scp: "data/se/voicebank_demand/voicebank_clean_train.scp"   # 四列 uid/fs/length/path；11572 条
    noisy_scp: "data/se/voicebank_demand/voicebank_noisy_train.scp"   # 与 clean_scp 逐条配对，uid 一一对应
    # 官方 num_frames=256 且 center=True，对应 (256-1)*128=32640 samples。
    max_duration: 32640  # 固定画布样本数，即 2.04 s @ 16 kHz；超长样本同步随机裁切到该长度
    # 禁止 tile/repeat；短样本由 MeanFlowSETrainer 对称零补齐。
    repeat_to_max_duration: false  # 关闭 tile/repeat：官方语义是零补齐而非重复，tile 会引入周期性伪影
  # validation 不设 max_duration/repeat_to_max_duration：沿用 offline Dataset 默认 max_duration=-1、repeat=False
  validation:            # 验证 split：不裁切、不 tile，保持原始时长
    clean_scp: "data/se/voicebank_demand/voicebank_clean_val.scp"     # 824 条测试集配对
    noisy_scp: "data/se/voicebank_demand/voicebank_noisy_val.scp"     # 与 clean_scp 逐条配对
  dataloader:            # DataLoader 公共参数；train/val 共享（val_num_workers 等可另行覆盖）
    batch_size: 2        # 单卡 batch（假设：未做显存扫描；42.4M 参数 + JVP 二阶图下取 2）
    num_workers: 4       # 训练 DataLoader 进程数；验证 loader 默认沿用本值
    pin_memory: true     # 锁页内存加速 H2D 拷贝；仅在 CUDA 训练时有收益

# ---- loss：objective 由 MeanFlowSE training forward 直接计算；该 loss 仅满足统一配置契约 ----
loss:
  type: ScalarPassthroughLoss  # 直接透传模型返回的 scalar（core/losses/scalar_passthrough.py）；真实目标函数（MeanFlow + 一阶修正）在 MeanFlowSE.forward 内完成，故本段无 args

# ---- optimizer：Adam ----
optimizer:
  type: Adam             # build_single_optimizer；归一化层参数自动进入 no-decay 组
  args:                  # 透传给 torch.optim.Adam
    lr: 0.0001           # 初始学习率（无量纲）；生成式 NCSN++ 常用 1e-4；未设 eps 即 torch 默认 1e-8

# ---- scheduler：按验证 loss 平台期衰减（core/optim/scheduler.py 的 _Plateau）----
scheduler:
  type: ReduceLROnPlateau  # torch 原生；与 trainer.lr_schedule_per_step=false 配套（按 epoch 调度）
  args:                  # 透传给 torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: min            # 监控 mean val loss，越低越好
    factor: 0.5          # 触发后 lr 乘 0.5（无量纲）
    patience: 5          # 连续 5 次 validation 无改善才衰减（单位：validation 次数）
    min_lr: 0.000001     # lr 下限 1e-6；达到后不再下降

# ---- trainer：MeanFlowSETrainer（生成式双谱 objective，单优化器）----
trainer:
  type: MeanFlowSETrainer   # 生成式 loss-returning 特例 Trainer；同时负责固定画布零补齐与 noisy-peak 联合归一化
  exp_path: exp/se/meanflowse_ncsnpp_offline   # 产物根目录；须与 tests/test_configs.py 的固定前缀约定一致
  epochs: 150            # 训练轮数；未声明 max_steps，故按 epoch 跑满
  gradient_clip_value: 1.0   # 梯度范数裁剪阈值（无量纲，假设：未统计梯度范数）；JVP 二阶图梯度更陡，取 1.0 比通用 5.0 更紧
  accumulation_steps: 1      # 梯度累积步数；1 = 每个 batch 一次 optimizer step
  lr_schedule_per_step: false  # 调度器按 epoch step 一次（与 ReduceLROnPlateau 配套）
  log_interval: 10           # 每 N 个 optimizer step 打一条训练日志；单 epoch 步数少，故取 10
  validation_epoch_interval: 1   # 每 N 个 epoch 做一次 epoch 末验证（0 = 关闭）
  validation_steps_interval: 0   # 0 = 关闭步级验证；> 0 时需 save_top_k > 0（互斥语义见 core/trainer/base_trainer.py）
  max_val_batches: 0         # 每个 rank 单次 validation 的最大 forward batch 数；0 = 不限制
  # 客观指标（SI-SDR/PESQ/STOI）；interval 表示每 N 次 validation 计算一次
  val_metrics:
    enabled: true        # 启用侵入式在线指标；关闭则整段指标不参与验证
    metrics: [SI-SDR, PESQ, STOI]  # 指标枚举；均需 clean 参考
    interval: 1          # 每次 validation 都算指标（生成式模型收敛慢，需要密集观测）
    max_utterances: 100              # 全局指标上限；各 rank 均分（假设：未做耗时测量；生成式推理慢，故比判别式配置更小）
    max_utterances_metrics: 100  # 显式声明：省略时回退 max_utterances，避免“共享上限”误读
    metrics_workers: 2   # 每个 rank 的侵入式指标进程池大小；0 = 自动（受 CPU 数限制）
  save_checkpoint_interval: 10   # 仅 epoch 末周期性写 latest 与 model_{epoch}.pth
  save_top_k: 3                  # 保留 val_loss 最低的 top-k checkpoint（步级验证场景使用）

# ---- Distributed：DDP ----
distributed:
  backend: nccl          # 进程组后端；GPU 训练用 nccl（runtime 默认 nccl，CPU/Gloo 需显式改）
  find_unused_parameters: false  # 单路径前向使用全部参数；设 true 会多一次 autograd 遍历并可能触发 DDP 警告
