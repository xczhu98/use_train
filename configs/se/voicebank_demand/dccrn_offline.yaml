# ======================================================================
# 实验配置：DCCRN，VoiceBank-DEMAND，离线预混（16 kHz）
# ======================================================================
# 模型：原始 DCCRN-CL（complex encoder/LSTM/decoder，E 模式复掩码）；不是 ClearerVoice FRCRN
# Params：not measured（当前移植尚未运行独立参数审计）
# MACs：not measured（复卷积与复 LSTM 尚未由 profiler 独立复核）
# FLOPs：not measured（不得用 MACs 倍数推算）
# Trainer MOS boundary：Trainer、模型 profile 与复杂度审计均不计算 MOS；DNSMOS/NISQA/UTMOS/SCOREQ 等须经 evaluate 离线计算
# 论文/参考：Y. Hu et al., "DCCRN: Deep Complex Convolution Recurrent Network for Phase-Aware Speech Enhancement", Interspeech 2020
# 移植边界：仅复用模型级拓扑；STFT/iSTFT 由本仓框架管理，无官方训练配置、checkpoint 或论文指标复现声明
# 数据：VCTK-DEMAND（Valentini-Botinhao et al. 2016）预混配对 clean/noisy 四列 SCP；offline 无在线仿真随机性
# 推荐入口：python train.py -C configs/se/voicebank_demand/dccrn_offline.yaml
# 模型实现：tasks/se/models/discriminative/dccrn.py（core 在 tasks/se/models/modules/dccrn_impl.py）
# 数据实现：core/data/offline_dataset.py（offline 配对 Dataset）
# ======================================================================

# ---- meta：全局训练超参（随机种子、精度开关、cuDNN 行为）----
meta:
  seed: 42               # 全局随机种子；Trainer 由此派生 validation seed 与 DataLoader worker seed（runtime 默认 42）
  use_amp: false         # 关闭 AMP：复卷积/复 LSTM 对精度敏感，本配置保持 FP32，未验证 BF16 数值
  use_ema: false         # 关闭 EMA 权重：论文 DCCRN 未使用 EMA，避免额外显存与 eval 分支
  # 关闭 cudnn 确定性（runtime 默认 false）；开启会牺牲吞吐，仅在需要逐 bit 复现时设 true
  deterministic: false

# ---- stft：框架负责 wav<->spec；谱进谱出模型只消费本段几何 ----
# 上游 DCCRN 默认 400-sample Hann 窗、100-sample 帧移和 512-point FFT。
stft:
  n_fft: 512             # FFT 长度（采样点），16 kHz 下 32 ms；决定频率轴 F = n_fft//2+1 = 257
  hop_length: 100        # 帧移（采样点），16 kHz 下 6.25 ms；上游 DCCRN 的 100-sample 帧移
  win_length: 400        # 窗长（采样点），16 kHz 下 25 ms；必须满足 hop_length <= win_length <= n_fft
  window: hann           # 分析窗类型；与上游 DCCRN 默认一致
  center: true           # 居中补齐（torch.stft center=True）；带来 win_length//2 = 200 samples lookahead，非严格因果；框架在构造 loss/模型前用 resolve_stft_config 校验 NOLA 与几何，非法组合 fail-fast

# ---- model：DCCRN（tasks/se/models/discriminative/dccrn.py）----
model:
  type: DCCRN            # registry 名称（tasks/se/models/discriminative/dccrn.py 的 @MODEL_REGISTRY.register）
  # n_fft/hop_length/win_length/window/center 由 build_model 从顶层 stft 注入；args 只放模型自身超参
  args:
    rnn_layers: 2        # recurrent bottleneck 的复 LSTM 层数（正整数）
    rnn_units: 256       # 复 LSTM 实部+虚部合计 hidden size（正整数）
    masking_mode: E      # 掩码模式枚举：E=幅相（论文默认）/ C=复乘 / R=分量缩放；本配置取 E
    use_clstm: true      # 使用上游 DCCRN-CL 复 LSTM；false 则退化为实 LSTM
    use_cbn: false       # 关闭复 BatchNorm，沿用官方示例的普通 BatchNorm；开启需核对官方实现细节
    kernel_size: 5       # encoder/decoder 频率轴卷积核大小（正整数）
    kernel_num: [16, 32, 64, 128, 256, 256]  # 六层 encoder 的实部+虚部合计通道数；必须恰好 6 项以匹配六层二倍降采样

# ---- data：VoiceBank-DEMAND 预混配对数据；路径与现有 VoiceBank 基线一致 ----
data:
  mode: offline          # 路由字段：offline 走 SE offline Dataset，读磁盘配对 SCP，不做在线仿真（fail-fast 于 normalize_data_mode）
  sample_rate: 16000     # 目标采样率 Hz；与 SCP 内嵌 fs 一致，否则按四列 SCP 的 fs 逐条校验
  train:                 # 训练 split：配对 clean/noisy SCP 与画布生命周期参数（Dataset 级，禁止写进 simulation_cfg）
    clean_scp: "data/se/voicebank_demand/voicebank_clean_train.scp"   # 四列 uid/fs/length/path；11572 条，相对仓库根
    noisy_scp: "data/se/voicebank_demand/voicebank_noisy_train.scp"   # 与 clean_scp 逐条配对，uid 必须一一对应
    max_duration: 128000              # 128000 样本，即 8 s @ 16 kHz；>0 时长样本按 clean/noisy 同步随机裁切
    repeat_to_max_duration: true      # 短样本 tile/repeat 到 max_duration（不是 collate pad）：批内等长、显存更稳；为 true 时 collate 不做 padding，false 时短样本原样返回并由 collate 补齐
  # validation 不设 max_duration/repeat_to_max_duration：沿用 offline Dataset 默认 max_duration=-1、repeat=False，
  # 即验证集不裁切、不 tile，保持原始时长与官方评测口径一致
  validation:
    clean_scp: "data/se/voicebank_demand/voicebank_clean_val.scp"     # 824 条测试集配对
    noisy_scp: "data/se/voicebank_demand/voicebank_noisy_val.scp"     # 与 clean_scp 逐条配对
  dataloader:            # DataLoader 公共参数；train/val 共享（val_num_workers 等可另行覆盖）
    batch_size: 2        # 单卡 batch（假设：未做显存扫描，按 8 s 画布与复 LSTM 规模估计取值）
    num_workers: 4       # 训练 DataLoader 进程数；验证 loader 默认沿用本值（见 configs/README.md「DataLoader 配置」）
    pin_memory: true     # 锁页内存加速 H2D 拷贝；仅在 CUDA 训练时有收益

# ---- loss：原始 DCCRN 训练目标为时域 SI-SNR；模型仍由框架 iSTFT 后计算该 loss ----
loss:
  type: SISNRLoss         # 负 SI-SNR（最小化该值等价最大化 SI-SNR），见 core/losses/time_domain.py
  args: {}               # 无显式参数；STFT 上下文由 runtime 按 loss 构造器声明注入（本 loss 不声明 STFT 参数）

# ---- optimizer：Adam ----
optimizer:
  type: Adam             # core/trainer/entry.py build_single_optimizer；归一化层参数自动进入 no-decay 组
  args:                  # 透传给 torch.optim.Adam；未知键由 torch 构造期拒绝
    lr: 0.001            # 初始学习率（无量纲，假设：未在上游仓库逐条核对；沿用 DCCRN 常用 1e-3）；未设 weight_decay 即 0.0

# ---- scheduler：按验证 loss 平台期衰减（core/optim/scheduler.py 的 _Plateau）----
scheduler:
  type: ReduceLROnPlateau  # torch 原生 ReduceLROnPlateau；与 trainer.lr_schedule_per_step=false 配套（按 epoch 调度）
  args:                  # 透传给 torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: min            # 监控 mean val loss，越低越好
    factor: 0.5          # 触发后 lr 乘 0.5（无量纲）
    patience: 3          # 连续 3 次 validation 无改善才衰减（单位：validation 次数）
    min_lr: 0.00000001   # lr 下限 1e-8；达到后不再下降

# ---- trainer：SETrainer（单优化器、无 GAN）----
trainer:
  type: SETrainer        # core/trainer/entry.py 按 type 解析；SE 任务通用 Trainer
  exp_path: exp/se/dccrn_offline   # 产物根目录；须与 tests/test_configs.py 的固定前缀约定一致（exp/se/<配置名>）
  epochs: 100            # 训练轮数；本配置未声明 max_steps，故按 epoch 跑满
  gradient_clip_value: 5.0   # 梯度范数裁剪阈值（无量纲，假设：未统计梯度范数，按通用 5.0 取值）；复 LSTM 易出现大梯度
  accumulation_steps: 1      # 梯度累积步数；1 = 每个 batch 一次 optimizer step
  lr_schedule_per_step: false  # 调度器按 epoch step 一次（与 ReduceLROnPlateau 配套）；true 则按 optimizer step
  log_interval: 50           # 每 N 个 optimizer step 打一条训练日志
  max_val_batches: 0         # 每个 rank 单次 validation 的最大 forward batch 数；0 = 不限制
  validation_epoch_interval: 1   # 每 N 个 epoch 做一次 epoch 末验证（0 = 关闭）
  validation_steps_interval: 0   # 0 = 关闭步级验证；> 0 时需 save_top_k > 0（互斥语义见 core/trainer/base_trainer.py）
  save_top_k: 3                  # 保留 val_loss 最低的 top-k checkpoint（步级验证场景使用）
  # 客观指标（SI-SDR/PESQ/STOI）；interval 表示每 N 次 validation 计算一次
  val_metrics:
    enabled: true        # 启用侵入式在线指标；关闭则整段指标不参与验证
    metrics: [SI-SDR, PESQ, STOI]  # 指标枚举；均需 clean 参考，且逐条在有效样点上计算
    interval: 5          # 每 5 次 validation 计算一次指标（省 CPU；loss 仍每次验证都算）
    max_utterances: 872              # 全局指标上限；各 rank 均分（当前 val SCP 实际 824 条，故最多评估 824 条）
    max_utterances_metrics: 872  # 显式声明：省略时回退 max_utterances，避免“共享上限”误读
    metrics_workers: 2   # 每个 rank 的侵入式指标进程池大小；0 = 自动（受 CPU 数限制）
  save_checkpoint_interval: 10   # 仅 epoch 末周期性写 latest 与 model_{epoch}.pth；步级 best 由 save_top_k 控制

# ---- Distributed：DDP ----
distributed:
  backend: nccl          # 进程组后端；GPU 训练用 nccl（runtime 默认 nccl，CPU/Gloo 需显式改）
  find_unused_parameters: false  # DCCRN 单路径前向使用全部参数；设 true 会多一次 autograd 遍历并可能触发 DDP 警告
