# ============================================================
# 离线 SS：TDANet（waveform-native）EchoSet 训练配方（K=2 固定源）
# ------------------------------------------------------------
# 任务：ss（Speech Separation，固定 K 路源分离）；数据管线 mode：offline_ss
# 模型：TDANet（TDANetBest-2ms-LRS2 拓扑，waveform-native，不消费框架 STFT）
# 采样率：16 kHz；帧移：N/A（waveform-native，无 STFT 帧）
# 数据来源：EchoSet 预生成 separation JSONL（data/ss/EchoSet/train.jsonl、val.jsonl），
#   offline_ss 无在线仿真随机性；train 做 3 s 随机裁剪，validation 不做裁剪。
# Params: 2.339431M total / trainable（已测量；TDANetBest-2ms-LRS2 拓扑，PyTorch parameter count）
# MACs: 6.963G @ 1 s / 16 kHz（THOP，partial/unverified；测量口径 B=1、时长 1 s、采样率 16 kHz、
#   T=16000；仅模型前向，不计数据仿真）
# FLOPs: 18.039G @ 1 s / 16 kHz（torch.utils.flop_counter.FlopCounterMode；仅模型前向）
# RTF: not measured（本机未做实时率测量）
# Trainer MOS boundary: Trainer 不计算 MOS；MOS 类指标须经 evaluate/ 离线评估流程计算。
# 推荐入口：python train.py -C configs/ss/tdanet/tdanet_echoset_offline.yaml
# 实现路径：模型 tasks/ss/models/tdanet.py；数据集 core/data（offline SS）+ tasks/ss/data；
#   entry tasks/ss/trainer/entry.py
# 枚举键取值参考（本文件所用键的合法集合；括号内为本文件当前取值）：
#   data.mode：dynamic / offline / dynamic_aec / offline_aec / dynamic_tse / offline_tse /
#     dynamic_ss / offline_ss / dynamic_ssl（offline_ss）
#   model.type：任务模型注册名，见 tasks/ss/models/__init__.py（TDANet）
#   loss.type：任务 loss 注册名（PITLoss）；loss.args.pairwise_loss：PairwiseNegSISDRLoss 等
#   loss.args.assignment：exhaustive（PITLoss 当前仅支持该值）
#   loss.args.reduction：mean（PITLoss 当前仅支持该值）
#   optimizer.type：torch.optim 类名（Adam / AdamW / SGD 等），另可回退 adamp 同名类（Adam）
#   scheduler.type：LinearWarmupCosineAnnealing / CosineAnnealingWarmupRestarts /
#     ExponentialDecrease / ExponentialLR / StepLR / CosineAnnealingLR / ReduceLROnPlateau
#     （ReduceLROnPlateau）
# ============================================================
# 运行元信息：复现种子、免 STFT 标记、AMP/EMA 开关。
meta:
  # 复现种子；驱动 offline 随机裁切与 DataLoader worker 的 epoch 状态。
  seed: 42
  # waveform-native 免 STFT 标记：TDANet 直接吃波形，不挂 STFT 前端；offline 数据本身也无 STFT。
  allow_no_stft: true
  # 混合精度开关；false = 全程 fp32。
  use_amp: false
  # 权重指数滑动平均开关；false = 不做 EMA。
  use_ema: false
  # true 时启用确定性算法（base_trainer 会同时关闭 cudnn.benchmark）；本配置保持 false 换取速度。
  deterministic: false
# 模型段：type 为注册表名，args 为模型 __init__ 的显式形参。
model:
  # 注册表模型名；TDANet（top-down attention 波形分离网络）。
  type: TDANet
  # 模型超参：均为 TDANet.__init__ 的显式形参，未知键会抛 TypeError。
  args:
    # 输出通道数。
    out_channels: 128
    # 输入通道数（编码器输入维度）。
    in_channels: 512
    # 重复块层数。
    num_blocks: 16
    # 上采样深度。
    upsampling_depth: 5
    # 编码器卷积核大小；2 ms @16 kHz = 32 samples 口径。
    enc_kernel_size: 2
    # 模型内部声明的采样率，单位 Hz；须与 data.sample_rate 一致。
    sample_rate: 16000
# 数据段：mode 为路由字段，offline split 只声明 manifest 与裁切参数。
data:
  # 数据管线模式；offline_ss = 使用预生成 separation JSONL，无在线仿真。
  mode: offline_ss
  # 目标采样率，单位 Hz；清单音频重采样到该值。
  sample_rate: 16000
  # 训练 split：预生成清单与随机裁切长度。
  train:
    # 训练 separation JSONL 清单；本机 data/ss/EchoSet/train.jsonl 存在（20268 行，含 2 路源）。
    manifest: data/ss/EchoSet/train.jsonl
    # 训练片段最大时长，单位 s；offline SS 在该长度内随机裁剪。
    max_duration_seconds: 3.0
  # 验证 split：仅声明清单，使用完整片段评估。
  validation:
    # 验证 separation JSONL 清单；本机 data/ss/EchoSet/val.jsonl 存在（4604 行）。
    manifest: data/ss/EchoSet/val.jsonl
  # DataLoader 参数。
  dataloader:
    # 每批样本数；1 = 逐条训练。
    batch_size: 1
    # 训练 loader worker 数。
    num_workers: 8
    # 是否锁页内存；true 可加速 GPU 拷贝。
    pin_memory: true
    # 是否保持 worker 存活跨 epoch；false = 每个 epoch 重建（offline 随机裁切依赖 epoch 状态）。
    persistent_workers: false
# SS 任务专属段：固定 K 路源合同；本配置未声明 ss.sir_range，缺省取 runtime 默认
# [-5.0, 5.0]（tasks/ss/data/config.py:46）；offline 预混数据不使用该键。
ss:
  # 固定 K 路源数；EchoSet 清单含 2 路源，须与 Dataset/模型/PIT 一致。
  num_sources: 2
# 损失段：type 与 args。
loss:
  # loss 类型；PITLoss（置换不变训练损失）。
  type: PITLoss
  # loss 构造参数。
  args:
    # 成对损失类型；PairwiseNegSISDRLoss = 负 SI-SDR。
    pairwise_loss: PairwiseNegSISDRLoss
    # 排列分配方式；exhaustive = 穷举全部 K! 排列取最优。
    assignment: exhaustive
    # 归约方式；mean = 对 batch 取均值。
    reduction: mean
# 优化器段：type 与 args。
optimizer:
  # 优化器类型；Adam。
  type: Adam
  # 优化器参数。
  args:
    # 学习率，无量纲。
    lr: 0.001
    # 权重衰减系数，无量纲；0.0 = 不衰减。
    weight_decay: 0.0
# 学习率调度段：type 与 args。
scheduler:
  # 调度器类型；ReduceLROnPlateau（验证指标停滞时衰减）。
  type: ReduceLROnPlateau
  # 调度器参数。
  args:
    # 监控方向；min = 指标越小越好。
    mode: min
    # 每次触发的衰减因子，无量纲。
    factor: 0.5
    # 无改善容忍 epoch 数。
    patience: 15
# 训练控制段。
trainer:
  # Trainer 类名；对应 tasks/ss/trainer/。
  type: SSTrainer
  # 实验输出目录（checkpoint / 日志 / TensorBoard）。
  exp_path: exp/ss/tdanet_echoset_offline
  # 训练总 epoch 数；offline 小数据集用长 schedule。
  epochs: 500
  # 梯度裁剪范数上限，无量纲。
  gradient_clip_value: 5.0
  # 梯度累积步数；1 = 不累积。
  accumulation_steps: 1
  # 学习率调度按 epoch 还是按 step；false = 每 epoch 调用一次（配合 ReduceLROnPlateau）。
  lr_schedule_per_step: false
  # 日志打印间隔，单位 optimizer step。
  log_interval: 50
  # 每次验证最多跑多少 batch；0 = 不限制。
  max_val_batches: 0
  # 每多少 epoch 做一次验证。
  validation_epoch_interval: 1
  # 每多少 step 做一次验证；0 = 关闭按 step 验证。
  validation_steps_interval: 0
  # 保留最优 checkpoint 数。
  save_top_k: 3
  # 在线验证指标配置。
  val_metrics:
    # 关闭在线指标：offline SS 配方不做侵入式指标；如需 SI-SDR 等由 evaluate/ 离线计算。
    enabled: false
  # checkpoint 保存间隔，单位 epoch。
  save_checkpoint_interval: 1
# 分布式段：多卡训练后端。
distributed:
  # 分布式后端；单卡与多卡统一 nccl；其余分布式键（如 find_unused_parameters）取 runtime 默认。
  backend: nccl
