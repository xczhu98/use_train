# ============================================================
# IPDnet fixed-array 官方最小复现配置（本机清单由 SSL 数据整理脚本生成）
# Params: not measured（官方 FN block 接入完成后记录）
# MACs: not measured（官方 FN block 接入完成后记录）
# FLOPs: not measured（官方 FN block 接入完成后记录）
# Trainer MOS boundary: not applicable（SSL 不计算波形 MOS）
# ============================================================
base_config: fixed_array_ipdnet_dynamic_moving.yaml

meta:
  task: ssl
  ssl_profile: ipdnet_official
  ssl_version: ipdnet_fixed_contract_v1
  inference_only: false

model:
  type: IPDNetFixed
  # 模型超参：均为 IPDNetFixed.__init__ 的显式形参，未知键会抛 TypeError。
  args:
    # 官方输入通道数 = 2C（real 通道块 + imag 通道块）；2 通道阵 → 4。
    input_size: 4
    # 官方 2 麦默认 FN 隐层宽度（官方 4/6 麦用 256）。
    hidden_size: 128
    # 输出最大轨数；必须等于 data.train.tracks。
    max_track: 2
    # 模型侧频点数口径 F=n_fft//2+1=257；与顶层 stft.n_fft 重复，以 stft 为准。
    n_fft: 512
    # 官方时间压缩：FN block 后 causal convolution + AvgPool，共 12 倍。
    stride: 12
    # online 变体（官方默认 is_online=True）：narrow-band LSTM 单向。
    causal: true
    # 官方 dropout 与 causal convolution 通道宽度。
    dropout: 0.2
    cnn_hidden_dim: 128
    # pair 的参考通道索引。
    reference_channel: 0
    # 官方 offline 分块推理段长；online 路径不使用，仅登记。
    n_seg: 312

model_spec:
  model_type: IPDNetFixed
  feature_contract: multichannel_stft_real_imag
  target_contract: dpipd_pair
  pair_layout: reference_to_all
  geometry_mode: fixed_array
  field_mode: far_field
  reduction: causal_conv_pool
  causal: true
  mapping: far_field_grid
  target_layout: trailing_ri

ssl:
  input_representation: multichannel_stft_real_imag
  target_representation: dpipd_far_field
  mapping: far_field_grid
  pair_layout: reference_to_all
  time_stride: 12
  exclude_dc: false
  normalization: none
  phase_sign: 1.0  # +1 与 projection 的 others*conj(ref) target 相位约定一致；-1 会落到镜像方位（round-trip 校准结论）
  coordinate_frame: room_xyz_m
  time_reduction: causal_conv_pool
  source_distance_input: false
  model_inputs: [multichannel_stft_real_imag]

loss:
  type: SSLDPIPDPITLoss
  # 清除父配置中仅供 SSLSpatialMSELoss 使用的参数；PIT 容量与 DOA 权重采用构造器默认值。
  args: null

trainer:
  exp_path: exp/ssl/ipdnet_fixed_dynamic
