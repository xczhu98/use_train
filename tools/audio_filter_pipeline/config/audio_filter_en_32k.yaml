#   采样率/证据：本地 header 抽样：48 kHz；官方采样率待核验。
#   证据状态：local_rate_only
  emns_spk: {input_root: "/data_nvme2n1/clean_speech_download/datasets/emns_spk", language: en, category: expressive, quality_profile: quality_balanced, speaker: {source: path_component, path_component: 0, required: false}}
# dataset_catalog: RAVDESS（ravdess_spk）
