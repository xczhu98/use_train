# 数据集注册表（dataset registry）
# 新增数据集只需在此添加条目，无需修改主代码。
# path 支持绝对路径或相对于本 registry 文件（config/）所在目录的相对路径。
# 生产模板使用仓库根 data/ 下的相对占位；data/ 已被 .gitignore 忽略，部署时请挂载、软链接
# 或在本地覆盖配置中改写为真实数据根目录。
#
# 字段说明：
#   id:           数据集唯一标识（会用于 record_id 前缀）
#   name:         可读名称
#   enabled:      是否启用
#   type:         directory | json | csv | huggingface
#   path:         数据根目录 / JSON 文件 / CSV 文件 / HuggingFace 仓库名或本地路径
#   input_pattern: directory 类型时的文件匹配模式，如 "**/*.wav"
#   label_source: directory 类型时标签来源：filename | directory | mapping | none
#   label_field:  json/huggingface 类型时的标签字段名
#   audio_field:  json/huggingface 类型时的音频字段名
#   label_column: csv 类型时的标签列名
#   audio_column: csv 类型时的音频路径列名
#   label_separator: csv 多标签分隔符
#   label_mapping: directory + mapping 时的 YAML 映射文件名
#   splits:       [train] 或 [train, val, test]
#   split_strategy: none | directory | ratio
#   split_ratio:  ratio 策略时的比例，如 [0.8, 0.1, 0.1]
#
# ----------------------------------------------------------------------------
# 当前项目数据集（模板中的路径为 18 个数据集的 ignored 占位）
# ----------------------------------------------------------------------------
# Stage A 会直接读取 enabled=true 条目；部署前请将对应数据挂载到这些相对路径，
# 或在本地覆盖配置中改写为实际目录。

datasets:
  - id: dns5_noise
    name: "DNS5 Fullband Noise"
    enabled: true
    type: directory
    path: "../../../data/noise/dns5_fullband/datasets_fullband/noise_fullband"
    input_pattern: "**/*.wav"
    label_source: filename
    label_mapping: null
    splits: [train]
    split_strategy: none
    license: "Microsoft Research License"
    notes: "DNS5 全频带噪声，子目录按来源分组"

  - id: fma_medium
    name: "FMA Medium"
    enabled: true
    type: directory
    path: "../../../data/noise/fma/fma_medium"
    input_pattern: "**/*.mp3"
    label_source: directory
    label_mapping: null
    splits: [train]
    split_strategy: none
    license: "CC BY-NC-SA 4.0"
    notes: "Free Music Archive，按数字子目录组织"

  - id: esc50
    name: "ESC-50"
    enabled: true
    type: directory
    path: "../../../data/noise/ESC-50-master/ESC50"
    input_pattern: "**/*.wav"
    label_source: mapping
    label_mapping: "esc50_to_audioset.yaml"
    splits: [train]
    split_strategy: none
    license: "CC BY-NC 3.0"
    notes: "50 类环境声，通过映射文件转换为 AudioSet 标签"

  - id: fsd50k
    name: "FSD50K"
    enabled: true
    type: directory
    path: "../../../data/noise/fsd50k/FSD50K.dev_audio"
    input_pattern: "**/*.wav"
    label_source: filename
    label_mapping: null
    splits: [train]
    split_strategy: none
    license: "Creative Commons"
    notes: "FSD50K 开发集音频；标签文件位于 FSD50K.ground_truth/dev.csv"

  - id: wham_noise
    name: "WHAM! Noise 48k"
    enabled: true
    type: directory
    path: "../../../data/noise/wham_noise_48k/high_res_wham"
    input_pattern: "**/*.wav"
    label_source: filename
    label_mapping: null
    splits: [train]
    split_strategy: none
    license: "CC BY 4.0"
    notes: "WHAM! 48kHz 高分辨率噪声"

  - id: mka
    name: "MKA Keyboard Audio"
    enabled: true
    type: directory
    path: "../../../data/noise/MKA"
    input_pattern: "**/*.wav"
    label_source: none
    label_mapping: null
    splits: [train]
    split_strategy: none
    license: "Unknown"
    notes: "键盘敲击音频数据集，包含多设备原始录音与按键分段"

  - id: wavcaps_audioset_sl
    name: "WavCaps AudioSet SL"
    enabled: true
    type: directory
    path: "../../../data/noise/WavCaps/Zip_files/AudioSet_SL"
    input_pattern: "**/*.flac"
    label_source: none
    label_mapping: null
    splits: [train]
    split_strategy: none
    license: "CC BY"
    notes: "WavCaps 子集：AudioSet 强标签音频"

  - id: wavcaps_bbc_sound_effects
    name: "WavCaps BBC Sound Effects"
    enabled: true
    type: directory
    path: "../../../data/noise/WavCaps/Zip_files/BBC_Sound_Effects"
    input_pattern: "**/*.flac"
    label_source: none
    label_mapping: null
    splits: [train]
    split_strategy: none
    license: "Remix License"
    notes: "WavCaps 子集：BBC 音效库"

  - id: wavcaps_freesound
    name: "WavCaps FreeSound"
    enabled: true
    type: directory
    path: "../../../data/noise/WavCaps/Zip_files/FreeSound"
    input_pattern: "**/*.flac"
    label_source: none
    label_mapping: null
    splits: [train]
    split_strategy: none
    license: "CC0/BY/BY-NC"
    notes: "WavCaps 子集：FreeSound 音频"

  - id: wavcaps_soundbible
    name: "WavCaps SoundBible"
    enabled: true
    type: directory
    path: "../../../data/noise/WavCaps/Zip_files/SoundBible"
    input_pattern: "**/*.flac"
    label_source: none
    label_mapping: null
    splits: [train]
    split_strategy: none
    license: "CC BY 4.0"
    notes: "WavCaps 子集：SoundBible 音效"

  # ---- 新增：DCASE 2019 环境声（3 个，都是 flac）----
